'cyberpunk':{rank:14,title:'Cyberpunk 2077',dev:'CD Projekt Red',publisher:'CD Projekt',year:2020,genre:'Action-RPG',subgenre:'Cyberpunk / Open World',rating:8.7,score:87,platforms:['PS','Xbox','PC'],img:'https://wallpapers.com/images/hd/cyberpunk-2077-s-megacity-5120x1440-gaming-orf4szuc1q3lmad5.jpg',tags:['Cyberpunk','Open World','Night City','RPG','Keanu Reeves','Redemption Story','Neon','First Person'],overview:`Cyberpunk 2077 is gaming's most remarkable redemption story. After a catastrophic launch plagued by bugs — particularly on last-generation consoles — CD Projekt Red spent two years rebuilding the game through patches, delivering on the original promise with version 2.0 and the Phantom Liberty expansion.\n\n  Night City — the game's setting — stands as one of gaming's greatest world-building achievements regardless of launch controversy. A neon-drenched West Coast megalopolis of six distinct districts, each with their own architecture, subcultures, and political dynamics, it creates the most convincing vision of a near-future dystopia the medium has produced.\n\n  Players inhabit V, a mercenary whose brain becomes entangled with the personality engram of legendary rockerboy Johnny Silverhand (voiced and motion-captured by Keanu Reeves). Their dynamic — an internal conflict between two identities sharing one body — drives a narrative of genuine philosophical depth about identity, legacy, and what it means to live a meaningful life.`,features:[{icon:'🏙️',title:'Night City',desc:'Six distinct districts of extraordinary density — arguably gaming\'s most realized future city.'},{icon:'🎭',title:'Johnny Silverhand',desc:'Keanu Reeves\'s motion-captured performance as the rebellious rockerboy is central to the narrative.'},{icon:'🔧',title:'V3 Build System',desc:'The 2.0 update completely overhauled the perk and build systems, enabling unprecedented depth.'},{icon:'🚗',title:'Vehicle Combat',desc:'Drive and shoot from vehicles — a feature added and refined substantially post-launch.'},{icon:'🕵️',title:'Braindance',desc:'Relive recorded memories through cybernetic implants to gather information and evidence.'},{icon:'🌃',title:'Phantom Liberty',desc:'An espionage expansion set in Dogtown featuring exceptional spy thriller storytelling.'}],scores:[{label:'Metacritic (PC)',val:86,color:'#5b4fff'},{label:'OpenCritic',val:85,color:'#7c6bff'},{label:'IGN (2.0)',val:90,color:'#ef4444'},{label:'GameSpot',val:70,color:'#f59e0b'},{label:'Eurogamer',val:80,color:'#10b981'},{label:'PC Gamer (2.0)',val:93,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9/10 (v2.0)',reviewer:'Tom Marks',text:'With version 2.0 and Phantom Liberty, Cyberpunk 2077 has become the game it always wanted to be. Night City is extraordinary, V\'s story is compelling, and the build depth now rivals the best in the RPG genre.'},{outlet:'PC Gamer',score:'93/100 (2.0)',reviewer:'Mollie Taylor',text:'The Cyberpunk 2077 of 2023 is a genuinely exceptional open-world RPG. The journey from broken launch to this point is unprecedented in the industry, and the destination is absolutely worth visiting.'},{outlet:'Eurogamer',score:'Recommended (2.0)',reviewer:'Ed Nightingale',text:'Night City deserves to be experienced. After two years of work, CD Projekt Red has delivered something truly remarkable from the ashes of one of gaming\'s most troubled launches.'}],awards:[{icon:'🏆',title:'Best RPG (Phantom Liberty)',org:'The Game Awards 2023'},{icon:'🌟',title:'Comeback of the Year',org:'Industry Recognition 2023'},{icon:'🎮',title:'Best World Design',org:'Multiple Publications'},{icon:'🏅',title:'Best Performance (Reeves)',org:'Multiple Awards Bodies'},{icon:'🌍',title:'21M+ Copies Sold',org:'CD Projekt Red 2023'},{icon:'💡',title:'Most Improved Game',org:'Community Recognition'}],sysreq:{min:{OS:'Windows 10 64-bit',CPU:'Intel Core i5-3570K / AMD FX-8310',RAM:'8 GB',GPU:'NVIDIA GTX 1060 6GB / AMD RX 580 8GB',Storage:'70 GB SSD'},rec:{OS:'Windows 11 64-bit',CPU:'Intel Core i7-6700K / AMD Ryzen 5 3600',RAM:'16 GB',GPU:'NVIDIA RTX 2060 / AMD RX 5700 XT',Storage:'70 GB SSD'}},trivia:['The initial PS4 launch version was so poor that Sony pulled the game from the PlayStation Store — unprecedented for a major AAA title.','Keanu Reeves personally approved every line of Johnny Silverhand\'s dialogue and spent months in motion capture.','Night City contains approximately 2 million individual dialogue lines — the largest recorded dialogue set of any game to date.']},

'sekiro':{rank:15,title:'Sekiro: Shadows Die Twice',dev:'FromSoftware',publisher:'Activision',year:2019,genre:'Action',subgenre:'Samurai / Soulslike',rating:9.3,score:93,platforms:['PS','Xbox','PC'],img:'https://www.allkeyshop.com/blog/wp-content/uploads/sekiro-shadows-die-twice-banner2.jpg',tags:['Samurai','Precision Combat','Feudal Japan','Challenging','Stealth','Shinobi','Posture','Parry'],overview:`Sekiro: Shadows Die Twice represents FromSoftware's most mechanically refined combat system — a deliberate departure from the Soulsborne formula toward pure precision swordsmanship. Set in a fictionalized Sengoku-period Japan of supernatural elements, players inhabit Wolf, a shinobi tasked with rescuing his kidnapped lord from a corrupted clan.\n\n  Where Dark Souls rewarded patience and stamina management, Sekiro rewards aggression and perfect timing. Its Posture system — where both Wolf and enemies have a Posture meter that breaks through sustained pressure and perfect deflections — creates sword duels of extraordinary tension. Landing a Deathblow on a major boss after learning their rhythm over dozens of attempts is among gaming's most cathartic experiences.\n\n  The stealth system, grappling hook traversal, and shinobi tool arsenal — shuriken, flame vents, firecrackers — provide tactical variety, but the game's heart is its dueling. FromSoftware created something genuinely unique: a combat system with the mechanical depth of a fighting game embedded in a world-class action-adventure.`,features:[{icon:'⚔️',title:'Posture System',desc:'Manage the Posture meter of both Wolf and enemies through deflections and pressure to land Deathblows.'},{icon:'🪝',title:'Grappling Hook',desc:'A shinobi grappling hook enables rapid vertical traversal and dramatic aerial approaches.'},{icon:'🎎',title:'Shinobi Tools',desc:'Equippable prosthetic tools — shuriken, flame vent, spear, firecracker — for tactical variety.'},{icon:'🕵️',title:'Stealth System',desc:'Approach encounters through stealth to gain positional advantages and backstab Deathblows.'},{icon:'🏯',title:'Sengoku Japan',desc:'A meticulously crafted supernatural version of feudal Japan — shrines, castles, forests, and cliffs.'},{icon:'🐍',title:'Giant Bosses',desc:'Colossal bosses including a divine dragon tree and an enormous serpent deity demand creative approaches.'}],scores:[{label:'Metacritic',val:90,color:'#5b4fff'},{label:'OpenCritic',val:91,color:'#7c6bff'},{label:'IGN',val:100,color:'#ef4444'},{label:'GameSpot',val:90,color:'#f59e0b'},{label:'Eurogamer',val:90,color:'#10b981'},{label:'Game Informer',val:95,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'10/10',reviewer:'Tom Marks',text:'Sekiro is FromSoftware\'s most accomplished game yet. Its combat demands everything from you and delivers rewards of extraordinary satisfaction. The duels in this game are unlike anything else in the medium.'},{outlet:'GameSpot',score:'9/10',reviewer:'Phil Hornshaw',text:'Sekiro\'s commitment to its specific vision of sword combat makes it the most mechanically precise FromSoftware title yet — and its world is among their most beautifully realized.'},{outlet:'Eurogamer',score:'Essential',reviewer:'Bertie Purchese',text:'Extraordinary. Sekiro is a game that demands you meet it on its own terms, and when you do, the rewards — the perfect deflections, the decisive Deathblows — are genuinely transcendent.'}],awards:[{icon:'🏆',title:'Game of the Year',org:'The Game Awards 2019'},{icon:'🌟',title:'Best Action Game',org:'The Game Awards 2019'},{icon:'🎮',title:'Best Art Direction',org:'The Game Awards 2019'},{icon:'🏅',title:'Best Game Direction',org:'The Game Awards 2019'},{icon:'🌍',title:'GOTY – 100+ outlets',org:'Multiple Publications 2019'},{icon:'💡',title:'Best Combat System',org:'Industry Recognition'}],sysreq:{min:{OS:'Windows 10 64-bit',CPU:'Intel Core i3-2100 / AMD FX-6300',RAM:'4 GB',GPU:'NVIDIA GTX 760 / AMD Radeon HD 7950',Storage:'12.5 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i5-2500K / AMD Ryzen 5 3600',RAM:'8 GB',GPU:'NVIDIA GTX 1070 / AMD RX 5700',Storage:'12.5 GB SSD'}},trivia:['Sekiro won four major categories at The Game Awards 2019 — GOTY, Best Action, Best Art Direction, and Best Game Direction — a rare sweep.','Miyazaki has cited samurai film director Akira Kurosawa as a major influence on Sekiro\'s combat choreography.','The game\'s final boss, Isshin, Saint of Swords, is widely considered one of the greatest boss encounters in the history of action games.']},

'cod-mw2':{rank:16,title:'Call of Duty: Modern Warfare 2',dev:'Infinity Ward',publisher:'Activision',year:2009,genre:'FPS',subgenre:'Military Shooter',rating:9.0,score:90,platforms:['PS','Xbox','PC'],img:'https://images.hdqwalls.com/wallpapers/call-of-duty-modern-warfare-2-campaign-remastered-4k-vw.jpg',tags:['FPS','Military','Multiplayer','Campaign','Killstreaks','Spec Ops','Classic','No Russian'],overview:`Call of Duty: Modern Warfare 2 is the apex of the classic Call of Duty era — a title that sold over 22 million copies and represented the high watermark of the franchise's cultural dominance. Building on the groundbreaking original Modern Warfare, Infinity Ward delivered a more ambitious, more spectacle-driven campaign while simultaneously refining the multiplayer formula to what many still consider its ultimate form.\n\n  The multiplayer suite — with its expanded killstreak system (Predator Missile, AC-130, tactical nuke), map design of studied excellence, and perk tree of genuine strategic depth — created an experience of addictive, finely tuned competitive play that dominated living rooms and game nights for years. Maps like Terminal, Highrise, Rust, and Favela remain in the community's collective memory as benchmarks of the genre.\n\n  The campaign, while shorter than the first Modern Warfare, delivered unforgettable set-pieces — including the controversial "No Russian" airport mission — across a global escalating conflict. Spec Ops mode added co-operative missions of excellent variety for players seeking team challenges.`,features:[{icon:'💥',title:'Killstreak System',desc:'Earn streaks for air strikes, Predator Missiles, Harriers, and the devastating tactical nuke.'},{icon:'🗺️',title:'Classic Maps',desc:'Terminal, Highrise, Rust, Favela — map designs of studied excellence that the community still loves.'},{icon:'🎮',title:'Spec Ops Mode',desc:'Co-operative mission mode providing a separate challenge layer outside campaign and multiplayer.'},{icon:'🌍',title:'Global Campaign',desc:'Set-pieces across Rio, Washington D.C., Afghanistan, and a submarine base in Russia.'},{icon:'✈️',title:'No Russian Mission',desc:'A controversial optional mission that generated unprecedented mainstream media coverage.'},{icon:'🔧',title:'Create-A-Class',desc:'An expanded class creation system with perks, secondary weapons, and equipment of genuine depth.'}],scores:[{label:'Metacritic (X360)',val:94,color:'#5b4fff'},{label:'OpenCritic',val:92,color:'#7c6bff'},{label:'IGN',val:95,color:'#ef4444'},{label:'GameSpot',val:95,color:'#f59e0b'},{label:'Edge Magazine',val:80,color:'#10b981'},{label:'OXM',val:95,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.5/10',reviewer:'Ryan McCaffrey',text:'Modern Warfare 2 is the most complete Call of Duty game yet. Its multiplayer is the most refined and rewarding in the series, its campaign delivers spectacular set-pieces, and Spec Ops adds genuine co-operative value.'},{outlet:'GameSpot',score:'9.5/10',reviewer:'Chris Watters',text:'A landmark in the FPS genre. Modern Warfare 2\'s multiplayer is extraordinary — perfectly balanced, creatively designed, and endlessly replayable. A defining game of its generation.'},{outlet:'OXM',score:'9.5/10',reviewer:'OXM Staff',text:'The most polished, complete, and addictive shooter on the market. Modern Warfare 2\'s multiplayer alone justifies the price multiple times over.'}],awards:[{icon:'🏆',title:'Best Shooter',org:'Spike VGAs 2009'},{icon:'🌟',title:'Best Multiplayer',org:'Multiple Publications 2009'},{icon:'🎮',title:'22M+ Copies Sold',org:'Activision Records'},{icon:'🏅',title:'Game of the Year',org:'Multiple Publications 2009'},{icon:'🌍',title:'Fastest-Selling 2009',org:'NPD Sales Records'},{icon:'💡',title:'Multiplayer Legacy',org:'Still Played 15 Years Later'}],sysreq:{min:{OS:'Windows XP/Vista/7',CPU:'Intel Core 2 Duo E6600 / AMD Phenom X3 8750',RAM:'1 GB (XP) / 2 GB (Vista)',GPU:'NVIDIA 8600GT / ATI X1950',Storage:'12 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i5 / AMD Ryzen 5',RAM:'8 GB',GPU:'NVIDIA GTX 1060 / AMD RX 580',Storage:'12 GB SSD'}},trivia:['Modern Warfare 2 sold 4.7 million copies on its first day — breaking the entertainment industry record at the time.','The "No Russian" mission — in which players can participate in a terrorist airport massacre — caused parliamentary discussions in multiple countries about video game content.','The game\'s "tactical nuke" killstreak (25 kills) instantly ends the match — a reward so rare that online video compilations of people achieving it garnered millions of views.']},

'overwatch':{rank:17,title:'Overwatch',dev:'Blizzard Entertainment',publisher:'Blizzard Entertainment',year:2016,genre:'FPS',subgenre:'Hero Shooter',rating:8.8,score:88,platforms:['PS','Xbox','PC'],img:'https://images4.alphacoders.com/553/thumb-1920-553496.jpg',tags:['Hero Shooter','Team-Based','Competitive','Colorful','Esports','Lore-Rich','Diverse Cast','Seasonal'],overview:`Overwatch revitalized team-based competitive shooters for a new generation, introducing the hero shooter genre to mainstream audiences with a cast of 30+ characters of extraordinary diversity, playability, and lore depth. Blizzard's first new IP in nearly two decades, it became one of the fastest-growing games in history upon launch.\n\n  The game's design philosophy — diverse heroes with wildly distinct abilities, each filling a role within a team structure — created a deep meta-game of counter-picking and composition that sustained enormous professional esports scenes globally. Characters ranged from barrier tank Reinhardt to time-reversal healer Mercy to sniper Widowmaker, each demanding different skills and enabling different play styles.\n\n  Overwatch's visual design set a new standard for character artistry in games — each hero instantly readable, culturally distinct, and possessed of a rich backstory conveyed through animated shorts of exceptional quality. The game has since transitioned to Overwatch 2, a free-to-play model, though the original's legacy as a defining esports and pop culture phenomenon is secure.`,features:[{icon:'🦸',title:'35+ Heroes',desc:'A diverse roster spanning tanks, supports, and damage heroes — each with unique ability sets.'},{icon:'🎯',title:'Role Queue',desc:'Structured matchmaking ensuring team compositions are balanced across tank, support, and DPS roles.'},{icon:'🌍',title:'Global Maps',desc:'Assault, Escort, Hybrid, and Control maps set across beautifully designed global locations.'},{icon:'🎬',title:'Animated Shorts',desc:'High-quality animated shorts expanding the game\'s rich lore — watched hundreds of millions of times.'},{icon:'🏆',title:'Overwatch League',desc:'A city-based professional esports league with franchised teams across the world.'},{icon:'🎨',title:'Distinctive Art Style',desc:'A Pixar-influenced aesthetic that made every hero immediately iconic and recognizable.'}],scores:[{label:'Metacritic (PC)',val:91,color:'#5b4fff'},{label:'OpenCritic',val:90,color:'#7c6bff'},{label:'IGN',val:95,color:'#ef4444'},{label:'GameSpot',val:90,color:'#f59e0b'},{label:'Eurogamer',val:95,color:'#10b981'},{label:'PC Gamer',val:93,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.5/10',reviewer:'Vince Ingenito',text:'Overwatch is a landmark achievement in multiplayer game design. Its cast of heroes is one of gaming\'s most diverse and well-designed, and the game beneath them is one of the most polished and rewarding team shooters ever made.'},{outlet:'PC Gamer',score:'93/100',reviewer:'Andy Kelly',text:'Exceptional. Overwatch brings the character-driven approach of fighting games to the team shooter — and the result is something genuinely new, endlessly playable, and thoroughly joyful.'},{outlet:'Eurogamer',score:'Essential',reviewer:'Rich Stanton',text:'Overwatch is brilliant. Blizzard has taken the team shooter and rebuilt it around hero characters of exceptional design, creating something that rewards deep play without punishing newcomers.'}],awards:[{icon:'🏆',title:'Game of the Year',org:'The Game Awards 2016'},{icon:'🌟',title:'Best Multiplayer',org:'The Game Awards 2016'},{icon:'🎮',title:'GOTY – Multiple outlets',org:'Multiple Publications 2016'},{icon:'🏅',title:'Best Esports Game',org:'The Game Awards 2016'},{icon:'🌍',title:'35M Players Year One',org:'Blizzard Records'},{icon:'💡',title:'Best Art Direction',org:'Multiple Awards 2016'}],sysreq:{min:{OS:'Windows 7/8/10 64-bit',CPU:'Intel Core i3 / AMD Phenom X3 8650',RAM:'4 GB',GPU:'NVIDIA GTX 460 / ATI HD 4850',Storage:'30 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i7 / AMD Ryzen 7',RAM:'8 GB',GPU:'NVIDIA GTX 1060 / AMD RX 580',Storage:'30 GB SSD'}},trivia:['Overwatch was developed by a team that had mostly worked on cancelled Blizzard MMO Titan — key ideas and assets were repurposed from that project.','The "Play of the Game" highlight system became a viral content format on Twitch and YouTube, significantly driving early adoption.','Tracer — the game\'s cover character — was confirmed as gay in a 2016 comic, making her one of the first LGBTQ+ characters in a major gaming franchise.']},

'league':{rank:18,title:'League of Legends',dev:'Riot Games',publisher:'Riot Games',year:2009,genre:'MOBA',subgenre:'Competitive Strategy',rating:8.5,score:85,platforms:['PC'],img:'https://images8.alphacoders.com/406/406806.png',tags:['MOBA','Competitive','Esports','Free-to-Play','Champions','Ranked','Team Strategy','5v5'],overview:`League of Legends is the world's most played PC game and the cornerstone of modern professional esports. Launched in 2009 as Riot Games' debut title, it refined the MOBA genre — pioneered by the Warcraft III custom map Defense of the Ancients — into a polished, free-to-play competitive experience accessible to newcomers but with the mechanical ceiling of a world-class competitive sport.\n\n  The game's 5v5 structure — three lanes, a jungle, and an objective-driven map — has remained remarkably consistent in 15 years of operation, demonstrating the robustness of its foundational design. With 165+ playable champions, each with unique abilities and playstyles, the meta-game of champion selection, composition, and counter-picking creates strategic depth that professional teams dedicate careers to mastering.\n\n  The World Championship — Worlds — has become one of esports' defining annual events, drawing peak viewership exceeding 73 million concurrent viewers. Riot Games has since expanded the universe through Arcane (an Emmy-winning Netflix animated series), Teamfight Tactics, Legends of Runeterra, and Valorant.`,features:[{icon:'⚔️',title:'165+ Champions',desc:'An ever-expanding roster of champions with distinct roles, abilities, and playstyles.'},{icon:'🗺️',title:'Summoners Rift',desc:'The iconic 5v5 map — three lanes, a jungle, and Baron Nashor — unchanged in its essence for 15 years.'},{icon:'🏆',title:'Ranked System',desc:'Iron through Challenger ranked ladder system supporting serious competitive play at every level.'},{icon:'🎯',title:'Objective Control',desc:'Dragons, Baron, and towers — objective-focused gameplay that rewards team coordination over individual kills.'},{icon:'📺',title:'World Championship',desc:'Annual Worlds event with peak viewership of 73M — one of the most-watched esports events in history.'},{icon:'🎬',title:'Arcane Series',desc:'Emmy Award-winning Netflix animated series set in the League of Legends universe.'}],scores:[{label:'Metacritic',val:78,color:'#5b4fff'},{label:'OpenCritic',val:82,color:'#7c6bff'},{label:'IGN',val:80,color:'#ef4444'},{label:'GameSpot',val:80,color:'#f59e0b'},{label:'PC Gamer',val:90,color:'#10b981'},{label:'User Score',val:67,color:'#3b82f6'}],reviews:[{outlet:'PC Gamer',score:'90/100',reviewer:'Josh Augustine',text:'League of Legends is the most important PC game of the last decade. Its competitive depth, champion roster breadth, and the world-class ecosystem Riot has built around it make it one of the defining games of the era.'},{outlet:'IGN',score:'8/10',reviewer:'Charles Onyett',text:'League of Legends is an extremely polished MOBA that rewards deep play and team coordination. Its free-to-play model, accessible learning curve, and rich competitive scene make it endlessly compelling.'},{outlet:'GameSpot',score:'8/10',reviewer:'Kevin VanOrd',text:'A remarkable achievement in competitive game design. League of Legends combines accessibility with depth, offering something for both casual players and dedicated competitors.'}],awards:[{icon:'🏆',title:'Worlds 2023 Viewership',org:'73M Peak Concurrent'},{icon:'🌟',title:'Most Played PC Game',org:'15+ Years Running'},{icon:'🎮',title:'Arcane Emmy Award',org:'Netflix Series 2022'},{icon:'🏅',title:'Best Esports Game',org:'Multiple Awards Bodies'},{icon:'🌍',title:'165+ Champions',org:'Ongoing Development'},{icon:'💡',title:'Free-to-Play Pioneer',org:'Industry Model Influence'}],sysreq:{min:{OS:'Windows XP/Vista/7/8/10',CPU:'Intel Core i3 / AMD Ryzen 3',RAM:'4 GB',GPU:'NVIDIA GeForce 560 / AMD HD 6950',Storage:'16 GB'},rec:{OS:'Windows 10/11 64-bit',CPU:'Intel Core i5-3300 / AMD Ryzen 5 3600',RAM:'8 GB',GPU:'NVIDIA GTX 1050 Ti / AMD Radeon RX 560',Storage:'16 GB SSD'}},trivia:['The 2023 World Championship generated a peak viewership of 73 million concurrent viewers — more than any previous esports event.','Riot Games was acquired by Tencent in 2011 — a relationship that significantly accelerated the game\'s expansion into Asian markets.','The Arcane animated series won the Emmy for Outstanding Animated Program in 2022 — the first video game adaptation to win in that category.']},

'among-us':{rank:20,title:'Among Us',dev:'InnerSloth',publisher:'InnerSloth',year:2018,genre:'Social Deduction',subgenre:'Party Game',rating:8.0,score:80,platforms:['PC','Mobile','Switch'],img:'https://gamingbolt.com/wp-content/uploads/2020/09/Among-Us.jpg',tags:['Social Deduction','Party','Multiplayer','Pandemic Hit','Deception','Crewmates','Imposter','Voice Chat'],overview:`Among Us is a study in how the simplest idea, arriving at the right moment, can become a global phenomenon. Released in 2018 to modest attention, it exploded in mid-2020 when pandemic lockdowns drove millions to seek social gaming experiences — and Twitch streamers including Disguised Toast, Pokimane, and AOC's Alexandria Ocasio-Cortez hosted sessions that generated hundreds of millions of views.\n\n  The game's premise is elegantly simple: a spaceship crew of up to 15 players must identify hidden Impostors among them through discussion, voting, and observational deduction. Impostors must sabotage the ship and eliminate Crewmates without being caught. Every game generates unique social dynamics of accusation, alliance, and deception that are impossible to script.\n\n  Among Us demonstrated that the most compelling game design isn't necessarily the most complex — and that the right social context can transform a modest indie title into a cultural touchstone.`,features:[{icon:'🚀',title:'Four Maps',desc:'The Skeld, MIRA HQ, Polus, and The Airship offer varied layouts and venting systems.'},{icon:'🔴',title:'Impostor Mechanics',desc:'Sabotage systems, venting, and murder mechanics designed to create paranoia and misdirection.'},{icon:'💬',title:'Discussion Voting',desc:'Emergency meetings enable group discussion and democratic voting to eject suspected Impostors.'},{icon:'🔧',title:'Tasks System',desc:'Crewmates complete visual and non-visual tasks — completion of all tasks wins the game.'},{icon:'🎭',title:'Roles Update',desc:'Added Engineer, Scientist, Guardian Angel, and Shapeshifter roles expanding strategic options.'},{icon:'🌐',title:'Cross-Platform',desc:'Seamless cross-platform play across PC, Mobile, Nintendo Switch, and consoles.'}],scores:[{label:'Metacritic (Switch)',val:85,color:'#5b4fff'},{label:'OpenCritic',val:83,color:'#7c6bff'},{label:'IGN',val:80,color:'#ef4444'},{label:'GameSpot',val:80,color:'#f59e0b'},{label:'TouchArcade',val:90,color:'#10b981'},{label:'Nintendo Life',val:70,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'8/10',reviewer:'Miranda Sanchez',text:'Among Us is a supremely social experience that thrives in group settings. Its simple premise generates complicated dynamics of trust, deception, and accusation that few game systems can match for pure social entertainment.'},{outlet:'GameSpot',score:'8/10',reviewer:'Jordan Ramée',text:'A brilliant social deduction game made extraordinary by its accessibility and the richness of the human dynamics it generates. No two games of Among Us are ever quite the same.'},{outlet:'TouchArcade',score:'9/10',reviewer:'Jared Nelson',text:'Among Us is the rare mobile game that works just as well — or better — in a group setting. Its simple mechanics create endlessly complex social situations.'}],awards:[{icon:'🏆',title:'Mobile Game of the Year',org:'Multiple Awards 2020'},{icon:'🌟',title:'Pandemic Cultural Phenomenon',org:'TIME/IGN Recognition'},{icon:'🎮',title:'Best Multiplayer',org:'Multiple Publications 2020'},{icon:'🏅',title:'500M+ Downloads',org:'InnerSloth Records'},{icon:'🌍',title:'AOC Twitch Stream',dest:'435K Concurrent Viewers'},{icon:'💡',title:'Social Gaming Pioneer',org:'Industry Recognition'}],sysreq:{min:{OS:'Windows 7 SP1+',CPU:'SSE2 instruction set support',RAM:'1 GB',GPU:'Graphics card with DX10 / OpenGL 3',Storage:'250 MB'},rec:{OS:'Windows 10 64-bit',CPU:'Any modern processor',RAM:'2 GB',GPU:'Any modern GPU',Storage:'500 MB'}},trivia:['Among Us was released in 2018 and had under 100 concurrent players for two years before suddenly exploding in August 2020.','InnerSloth is a three-person studio — the overnight success of Among Us required them to rapidly scale operations while simultaneously patching the game.','AOC\'s Among Us Twitch stream in October 2020 drew 435,000 concurrent viewers, one of the platform\'s highest counts at the time.']},

'ff7':{rank:21,title:'Final Fantasy VII',dev:'Square',publisher:'Square / Sony',year:1997,genre:'RPG',subgenre:'JRPG',rating:9.5,score:95,platforms:['PS','PC'],img:'https://wallpapercave.com/wp/4Z9eXRH.jpg',tags:['JRPG','Classic','Story Rich','Materia System','Iconic','Aerith','Cloud','Sephiroth'],overview:`Final Fantasy VII is the game that brought Japanese role-playing games to a global audience and established the JRPG as a mainstream genre in Western markets. Released in 1997 for PlayStation, it was a technical and artistic landmark — the first mainline Final Fantasy in 3D, featuring pre-rendered backgrounds of cinematic quality and FMV sequences of unprecedented scope.\n\n  Cloud Strife, Aerith Gainsborough, Tifa Lockhart, and Sephiroth remain gaming's most culturally embedded characters — each recognizable to millions of people who have never played the game. The narrative — centered on a dystopian mega-corporation draining the planet's life force — was more sophisticated, more politically conscious, and more emotionally ambitious than any JRPG that preceded it.\n\n  The Materia magic system — equipping magical orbs to weapons and armor — provided strategic depth and character customization of extraordinary flexibility. The game's iconic twist (preserved deliberately unspoiled here) remains one of the most discussed narrative moments in gaming history. The Remake project — spanning multiple episodes — demonstrates how enduring the original's legacy remains.`,features:[{icon:'💎',title:'Materia System',desc:'Equip Materia orbs to weapons and armor to grant magical abilities — hundreds of combinations.'},{icon:'🌆',title:'Midgar',desc:'One of gaming\'s most iconic settings — a dystopian city of steel plates crushing the slums beneath.'},{icon:'⚔️',title:'Limit Breaks',desc:'Character-specific Limit Break abilities activated through sustained damage — visually spectacular.'},{icon:'🐦',title:'Chocobo Breeding',desc:'Breed and race Chocobos across multiple generations to unlock rare colored varieties and Materia.'},{icon:'🎮',title:'Minigames',desc:'Snowboarding, submarine battles, motorcycle chase, and Gold Saucer entertainment complex.'},{icon:'🎵',title:'Nobuo Uematsu',desc:'One of the greatest game soundtracks ever composed — Aerith\'s Theme is gaming\'s most emotional piece of music.'}],scores:[{label:'Metacritic (PSX)',val:92,color:'#5b4fff'},{label:'Famitsu',val:96,color:'#7c6bff'},{label:'IGN (Original)',val:96,color:'#ef4444'},{label:'GameSpot (Original)',val:96,color:'#f59e0b'},{label:'EGM',val:100,color:'#10b981'},{label:'Historical Impact',val:99,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.6/10 (original)',reviewer:'Andrew Vestal',text:'Final Fantasy VII is the greatest role-playing game ever made. Its story, characters, music, and presentation combine into an experience that transcends the medium and becomes something genuinely profound.'},{outlet:'GameSpot',score:'9.6/10 (original)',reviewer:'GameSpot Staff',text:'The best role-playing game available on any system. Final Fantasy VII sets a new standard for storytelling, presentation, and emotional depth in games that will influence the medium for decades.'},{outlet:'EGM',score:'10/10',reviewer:'EGM Staff',text:'A landmark achievement in every dimension — narrative, music, visual design, and systems depth. Final Fantasy VII is the most important RPG ever made.'}],awards:[{icon:'🏆',title:'JRPG of the Generation',org:'PS1 Era Recognition'},{icon:'🌟',title:'Brought JRPGs West',org:'Cultural Impact Award'},{icon:'🎮',title:'Nobuo Uematsu Score',org:'Music Legacy Recognition'},{icon:'🏅',title:'Remake – Multiple GOTYs',org:'Multiple Publications 2020'},{icon:'🌍',title:'13M+ Original Copies',org:'Sales Records'},{icon:'💡',title:'Most Requested Remake',org:'15 Years of Fan Campaigns'}],sysreq:{min:{OS:'Windows 7/8/10',CPU:'Intel Core 2 Duo 2.0GHz',RAM:'2 GB',GPU:'NVIDIA GeForce 5200 or better',Storage:'3 GB'},rec:{OS:'Windows 10 64-bit (Remake)',CPU:'Intel Core i7-8700 / AMD Ryzen 5 3600',RAM:'16 GB',GPU:'NVIDIA RTX 2080 / AMD RX 5700 XT',Storage:'100 GB SSD (Remake)'}},trivia:['The development of Final Fantasy VII required Square to switch from Nintendo to Sony — a seismic shift in the console wars with consequences that shaped the industry for years.','Aerith\'s death scene — which cannot be prevented regardless of player choices — remains gaming\'s most discussed narrative moment after nearly 30 years.','The 1997 PlayStation marketing campaign in the US was the most expensive ever mounted for a video game at the time — $100 million globally.']},

'half-life2':{rank:22,title:'Half-Life 2',dev:'Valve',publisher:'Valve',year:2004,genre:'FPS',subgenre:'Sci-Fi Shooter',rating:9.6,score:96,platforms:['PC'],img:'https://cdn.neowin.com/news/images/uploaded/2024/11/1731709897_hl2wallpaper02_16x9.jpg',tags:['FPS','Physics','Sci-Fi','Gravity Gun','Story Rich','No Cutscenes','City 17','Combine'],overview:`Half-Life 2 is perhaps the most technically and narratively sophisticated first-person shooter ever made. Released in 2004 after years of anticipation — and the theft and leaking of its source code in 2003 — it arrived as a statement of what the PC FPS could be: a seamlessly narrated, physics-driven, atmospherically extraordinary experience unlike anything the genre had produced.\n\n  Gordon Freeman returns in a dystopian future Earth under occupation by the alien Combine. City 17 — a Soviet-style city of suppression and quiet resistance — is one of gaming's greatest environmental achievements. The narrative unfolds without a single cutscene — all story beats delivered in real time while the player maintains control.\n\n  The Gravity Gun — which can grab, throw, and manipulate any physics object in the world — created emergent puzzle and combat possibilities of extraordinary breadth. Valve's Source engine, physically simulating every object in the game world, enabled interactions that felt genuinely new in 2004 and remain the benchmark against which physics implementations are measured.`,features:[{icon:'🔫',title:'Gravity Gun',desc:'Pick up, manipulate, and launch any physics object — saw blades, crates, explosive barrels, or enemies.'},{icon:'🎬',title:'No Cutscenes',desc:'The entire game\'s story unfolds in real time — Gordon never loses control, never sees a cut.'},{icon:'🏙️',title:'City 17',desc:'An extraordinarily realized dystopian Eastern European city under alien occupation.'},{icon:'🤖',title:'Combine AI',desc:'Enemy AI of exceptional sophistication — coordinating flanks, covering positions, and adapting to tactics.'},{icon:'🚗',title:'Vehicle Sections',desc:'Airboat and buggy sections provide exhilarating open-world travel across coastal highways and canals.'},{icon:'👾',title:'Ravenholm',desc:'An optional horror-inflected chapter through a zombie-overrun town — one of gaming\'s finest levels.'}],scores:[{label:'Metacritic',val:96,color:'#5b4fff'},{label:'OpenCritic',val:97,color:'#7c6bff'},{label:'IGN',val:97,color:'#ef4444'},{label:'GameSpot',val:96,color:'#f59e0b'},{label:'PC Gamer',val:96,color:'#10b981'},{label:'Edge Magazine',val:100,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.7/10',reviewer:'Douglass C. Perry',text:'Half-Life 2 is the greatest PC game ever made. Its combination of narrative sophistication, physics innovation, and sheer artistry of level design is unmatched. A landmark for the medium.'},{outlet:'Edge',score:'10/10',reviewer:'Edge Staff',text:'Half-Life 2 is extraordinary in every dimension — narrative, design, technology, atmosphere. Valve has delivered a sequel that exceeds the impossible expectations created by the original.'},{outlet:'PC Gamer',score:'96/100',reviewer:'Craig Pearson',text:'A triumph of game design. Half-Life 2 tells a story of oppression and resistance with a craft that most filmmakers would envy, played through mechanics of unprecedented physical sophistication.'}],awards:[{icon:'🏆',title:'GOTY – 39 publications',org:'Multiple Outlets 2004'},{icon:'🌟',title:'Best PC Game Ever',org:'Multiple Historical Rankings'},{icon:'🎮',title:'Technical Achievement',org:'GDC Awards 2005'},{icon:'🏅',title:'Source Engine Legacy',org:'Industry Foundation'},{icon:'🌍',title:'Steam Platform Launch',org:'Half-Life 2 Launch Title'},{icon:'💡',title:'Physics Benchmark',org:'Still Referenced Today'}],sysreq:{min:{OS:'Windows 7/10 64-bit',CPU:'1.7 GHz processor',RAM:'512 MB',GPU:'DirectX 8.1 level GPU',Storage:'15 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i5 / AMD Ryzen 5',RAM:'4 GB',GPU:'NVIDIA GTX 1050 / AMD RX 470',Storage:'15 GB SSD'}},trivia:['Half-Life 2\'s source code and assets were stolen and leaked online in 2003 — over a year before release. Valve\'s Gabe Newell personally addressed the incident in a community post.','Steam was launched specifically as the delivery platform for Half-Life 2 — its mandatory installation was initially controversial but proved visionary.','Alyx Vance is frequently cited as gaming\'s most realized female companion character and was the basis for the 2020 VR game Half-Life: Alyx.']},

'mario-kart8':{rank:23,title:'Mario Kart 8 Deluxe',dev:'Nintendo EPD',publisher:'Nintendo',year:2017,genre:'Racing',subgenre:'Kart Racing',rating:9.2,score:92,platforms:['Switch'],img:'https://img-eshop.cdn.nintendo.net/i/c6746200f54a1b6f2626f0ccf911d94a57f98bfc1d06b158b59c32d8e13df9b2.jpg',tags:['Racing','Family','Multiplayer','Nintendo','Colorful','Kart','Anti-Grav','200cc'],overview:`Mario Kart 8 Deluxe is the best-selling Nintendo Switch game of all time with over 60 million copies sold — and the definitive kart racing experience. The Deluxe edition of the Wii U original added all DLC, a completely revamped battle mode, and the Booster Course Pass — 48 additional tracks spanning Mario Kart history — bringing the total to 96 courses.\n\n  The game's anti-gravity mechanic — allowing vehicles to race on walls and ceilings — introduced genuinely three-dimensional track design that dramatically expanded what the genre could be. Combined with refined items, an extraordinary soundtrack, and the flexible appeal of playing portably on Switch, Mario Kart 8 Deluxe has become a near-universal Switch purchase and the go-to party game for households worldwide.\n\n  With 96 courses, 38+ racers, multiple engine classes, online play for up to 12 players, and local wireless for 8 players, the sheer volume of content makes it the most complete kart racing package ever released.`,features:[{icon:'🏎️',title:'96 Tracks',desc:'The Booster Course Pass brought the total to 96 tracks — the largest Mario Kart circuit list in history.'},{icon:'🔄',title:'Anti-Gravity',desc:'Race on walls and ceilings — anti-gravity sections turn the tracks into three-dimensional roller coasters.'},{icon:'👥',title:'Local Multiplayer',desc:'Up to 4 players locally, 8 players via local wireless, 12 players online.'},{icon:'🐢',title:'Items System',desc:'Blue shells, red shells, Bullet Bills, Boomerangs — an evolved item system of gleeful chaos.'},{icon:'🏁',title:'200cc Mode',desc:'The fastest engine class — 200cc requires entirely different braking-based technique to master.'},{icon:'🎵',title:'Live Orchestra',desc:'Each track features an orchestral, often jazz-influenced Nintendo score of extraordinary quality.'}],scores:[{label:'Metacritic',val:92,color:'#5b4fff'},{label:'OpenCritic',val:93,color:'#7c6bff'},{label:'IGN',val:93,color:'#ef4444'},{label:'GameSpot',val:90,color:'#f59e0b'},{label:'Eurogamer',val:90,color:'#10b981'},{label:'Nintendo Life',val:100,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.3/10',reviewer:'Brian Albert',text:'Mario Kart 8 Deluxe is the ultimate kart racing package. 96 tracks, polished mechanics, glorious local multiplayer, and a soundtrack of extraordinary quality make it the most complete the series has ever been.'},{outlet:'Eurogamer',score:'Essential',reviewer:'Martin Robinson',text:'Mario Kart 8 Deluxe is simply the best kart racer ever made. Its tracks are dazzling, its mechanics are refined, and its social appeal — around one Switch — is unmatched in the genre.'},{outlet:'Nintendo Life',score:'10/10',reviewer:'NL Staff',text:'The definitive version of the best Mario Kart ever made. With the Booster Course Pass, it has become an almost incomprehensibly complete racing package.'}],awards:[{icon:'🏆',title:'Best Sports/Racing Game',org:'The Game Awards 2017'},{icon:'🌟',title:'60M+ Copies Sold',org:'Nintendo\'s Best-Selling Switch Game'},{icon:'🎮',title:'Best Family Game',org:'Multiple Publications'},{icon:'🏅',title:'96-Track Collection',org:'Most Courses in Series History'},{icon:'🌍',title:'Best Local Multiplayer',org:'Multiple Awards Bodies'},{icon:'💡',title:'Switch Launch Essential',org:'Industry Recognition'}],sysreq:{min:{OS:'Nintendo Switch System Software',CPU:'Nintendo Switch SoC',RAM:'4 GB',GPU:'Nvidia Tegra X1',Storage:'8.4 GB'},rec:{OS:'Nintendo Switch (OLED)',CPU:'Nintendo Switch SoC',RAM:'4 GB',GPU:'Nvidia Tegra X1',Storage:'8.4 GB + microSD'}},trivia:['Mario Kart 8 Deluxe is Nintendo\'s best-selling Switch game ever — surpassing even Animal Crossing and Pokémon titles.','The Booster Course Pass added 48 tracks across 6 waves, mostly remasters of tracks from earlier Mario Kart games across all platforms.','The game\'s soundtrack features over 48 full orchestral recordings — Nintendo brought in a live orchestra for every track.']},

'gtasan':{rank:24,title:'GTA: San Andreas',dev:'Rockstar North',publisher:'Rockstar Games',year:2004,genre:'Action',subgenre:'Open World Crime',rating:9.4,score:94,platforms:['PS','Xbox','PC'],img:'https://wallpaperaccess.com/full/3662276.jpg',tags:['Open World','Crime','Story Rich','Hip-Hop','Classic','CJ','Gang Life','Three Cities'],overview:`GTA: San Andreas was the most ambitious game of its era — a vast, sprawling love letter to early-90s California that somehow delivered on all of its staggering promises. Three cities (Los Santos, San Fierro, and Las Venturas), a countryside connecting them, and an RPG-depth progression system made it a game so large it required months to fully explore.\n\n  Carl "CJ" Johnson returns from Liberty City to his home of Los Santos after his mother's murder, finding his old gang — the Grove Street Families — in disarray. His journey to rebuild the gang, navigate corrupt police, and ultimately confront the conspiracy behind his mother's death drives a narrative of surprising emotional depth, filtered through the aesthetic of 90s hip-hop and gangster cinema.\n\n  San Andreas introduced RPG elements unprecedented for the series: CJ could gain weight through overeating, build muscle through gym workouts, acquire driving and flying skills, and level up criminal proficiencies. The cultural impact of its soundtrack — hip-hop, R&B, funk, and classic rock — remains profound two decades later.`,features:[{icon:'🌆',title:'Three Cities',desc:'Los Santos, San Fierro, and Las Venturas — three distinct city environments plus connecting countryside.'},{icon:'🏋️',title:'RPG Stats',desc:'Build CJ\'s muscle, stamina, driving, flying, and shooting skills through repeated actions.'},{icon:'🎵',title:'Legendary Soundtrack',desc:'11 radio stations spanning West Coast hip-hop, G-funk, R&B, country, and classic rock.'},{icon:'🚗',title:'200+ Vehicles',desc:'Bicycles, lowriders, monster trucks, helicopters, jetpacks, and even a harvester.'},{icon:'🏠',title:'Property System',desc:'Buy properties, businesses, and assets across all three cities to generate passive income.'},{icon:'✈️',title:'Flight School',desc:'Earn a pilot\'s license to access airports and aircraft — a complete gameplay progression layer.'}],scores:[{label:'Metacritic (PS2)',val:95,color:'#5b4fff'},{label:'OpenCritic',val:94,color:'#7c6bff'},{label:'IGN',val:99,color:'#ef4444'},{label:'GameSpot',val:93,color:'#f59e0b'},{label:'Edge Magazine',val:90,color:'#10b981'},{label:'OPM',val:100,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.9/10',reviewer:'Erik Brudvig',text:'Grand Theft Auto: San Andreas is a stunning achievement. No game has ever delivered this much content at this level of quality. Rockstar has not only topped themselves — they\'ve created the greatest open-world game ever made.'},{outlet:'GameSpot',score:'9.3/10',reviewer:'Jeff Gerstmann',text:'San Andreas is an enormous, enormously entertaining game that delivers more variety, more content, and more personality than anything Rockstar has done before. An essential purchase.'},{outlet:'OPM',score:'10/10',reviewer:'OPM Staff',text:'An absolute masterpiece of game design. San Andreas delivers more than any game on any platform — its world is vast, its systems deep, and its story genuinely moving.'}],awards:[{icon:'🏆',title:'Game of the Year',org:'Multiple Publications 2004'},{icon:'🌟',title:'Best PS2 Game',org:'Multiple Awards 2004'},{icon:'🎮',title:'Best Open World',org:'Historical Recognition'},{icon:'🏅',title:'Cultural Legacy',org:'2020s Nostalgia Wave'},{icon:'🌍',title:'27M+ Copies (PS2)',org:'Best-Selling PS2 Game'},{icon:'💡',title:'Soundtrack Impact',org:'Multiple Music Awards'}],sysreq:{min:{OS:'Windows XP/Vista/7/10',CPU:'1 GHz Intel Pentium III / AMD Athlon',RAM:'256 MB',GPU:'64MB DirectX 9.0 compatible',Storage:'4.7 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i5 / AMD Ryzen 5',RAM:'8 GB',GPU:'NVIDIA GTX 1060 / AMD RX 580',Storage:'4.7 GB SSD'}},trivia:['GTA: San Andreas was the best-selling PS2 game of all time, with 27.5 million copies sold on that platform alone.','The controversy surrounding the "Hot Coffee" modification — which unlocked explicit cut content — led to an ESRB re-rating and Congressional hearings on video game content.','CJ\'s actor Young Maylay was discovered by Rockstar through music connections — his authentic portrayal of CJ contributed significantly to the character\'s cultural resonance.']},

'doom-eternal':{rank:25,title:'DOOM Eternal',dev:'id Software',publisher:'Bethesda Softworks',year:2020,genre:'FPS',subgenre:'Arena Shooter',rating:9.0,score:90,platforms:['PS','Xbox','PC','Switch'],img:'https://images.bauerhosting.com/legacy/media/5e70/f8b3/03ea/cb7b/8410/ac3d/doom-eternal-hero.jpg?ar=16:9&fit=crop&crop=top&auto=format&w=1440&q=80',tags:['FPS','Fast-Paced','Heavy Metal','Demons','Combat Mastery','Resource Management','Hell','Rip and Tear'],overview:`DOOM Eternal is the pinnacle of the modern arena shooter — a game of extraordinary mechanical complexity disguised beneath a veneer of pure, primal aggression. Where its 2016 predecessor introduced the push-forward combat philosophy, Eternal refined and deepened it into something demanding genuine mastery.\n\n  The central innovation is resource management: each enemy type drops a specific resource when dispatched in specific ways — Chainsaw kills replenish ammunition, Glory Kills restore health, Flame Belch fills armor. Running low on any resource during a fight requires switching tools and prioritizing targets accordingly. In expert hands, DOOM Eternal becomes a rhythmic, almost musical dance of violence — every weapon, every ability, every movement feeding into a system of extraordinary interconnection.\n\n  Mick Gordon's soundtrack — a genre-defining work of industrial metal and orchestral composition — perfectly mirrors the game's demanding intensity. The Ancient Gods DLC expanded the campaign with even more demanding encounters, earning acclaim independent of the base game.`,features:[{icon:'🔫',title:'Arsenal Depth',desc:'9 weapon archetypes each with two alternate modes — mastering all 18 functions is the game\'s true challenge.'},{icon:'⚡',title:'Resource Triangle',desc:'Chainsaw for ammo, Glory Kill for health, Flame Belch for armor — a self-sustaining resource loop.'},{icon:'👹',title:'Demon Knowledge',desc:'Each demon type has specific weak points and behaviors — learning them transforms combat from chaos to symphony.'},{icon:'🏋️',title:'Marauder',desc:'A mirror enemy that demands perfect timing and aggressive patience — DOOM Eternal\'s greatest test.'},{icon:'🎵',title:'Mick Gordon Score',desc:'One of gaming\'s most viscerally effective soundtracks — industrial metal timed to gameplay intensity.'},{icon:'🌍',title:'Hub World',desc:'The Fortress of Doom serves as an upgradeable hub between missions — with hidden rooms and lore.'}],scores:[{label:'Metacritic (PC)',val:88,color:'#5b4fff'},{label:'OpenCritic',val:89,color:'#7c6bff'},{label:'IGN',val:95,color:'#ef4444'},{label:'GameSpot',val:90,color:'#f59e0b'},{label:'Eurogamer',val:100,color:'#10b981'},{label:'PC Gamer',val:90,color:'#3b82f6'}],reviews:[{outlet:'Eurogamer',score:'Essential',reviewer:'Edwin Evans-Thirlwell',text:'DOOM Eternal is a masterpiece of combat design. Its systems are layered with extraordinary care, demanding everything from a player, and delivering rewards of near-musical satisfaction in return.'},{outlet:'IGN',score:'9.5/10',reviewer:'Tom Marks',text:'DOOM Eternal is the best single-player shooter in years. Its combat is deeper, faster, and more demanding than anything the genre has offered, and executing it perfectly is one of gaming\'s most satisfying experiences.'},{outlet:'GameSpot',score:'9/10',reviewer:'Tamoor Hussain',text:'A technical and mechanical triumph. DOOM Eternal\'s combat system has a ceiling of mastery that most games in any genre never approach.'}],awards:[{icon:'🏆',title:'Best Action Game',org:'The Game Awards 2020'},{icon:'🌟',title:'Best PC Game',org:'Multiple Publications 2020'},{icon:'🎮',title:'Best Shooter',org:'Multiple Awards 2020'},{icon:'🏅',title:'Mick Gordon Score',org:'Best Soundtrack Nominations'},{icon:'🌍',title:'Switch Port Achievement',org:'Technical Accomplishment'},{icon:'💡',title:'Combat Design Award',org:'Industry Recognition'}],sysreq:{min:{OS:'Windows 7/10 64-bit',CPU:'Intel Core i5 @ 3.3 GHz / AMD Ryzen 5',RAM:'8 GB',GPU:'NVIDIA GTX 970 4GB / AMD RX 470 8GB',Storage:'50 GB SSD'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i7-6700K / AMD Ryzen 7 1800X',RAM:'8 GB',GPU:'NVIDIA RTX 2080 / AMD RX 5700 XT',Storage:'50 GB SSD'}},trivia:['Mick Gordon\'s score became the subject of a public dispute between the composer and Bethesda regarding mixing and album release — one of gaming\'s more unusual public falling-outs.','DOOM Eternal\'s Switch port was managed by Panic Button — the same studio that ported Wolfenstein II and Warframe to Switch in high-quality versions.','The game\'s "Rip and Tear" philosophy was derived directly from the original 1993 DOOM\'s internal design documents.']},

'bloodborne':{rank:29,title:'Bloodborne',dev:'FromSoftware',publisher:'Sony Computer Entertainment',year:2015,genre:'Action-RPG',subgenre:'Gothic Horror',rating:9.2,score:92,platforms:['PS'],img:'https://static0.gamerantimages.com/wordpress/wp-content/uploads/2023/02/0_0007_bloodborne.jpg',tags:['Gothic Horror','Soulslike','Lovecraftian','Fast Combat','Atmosphere','Yharnam','Chalice Dungeons','Cosmic Horror'],overview:`Bloodborne is FromSoftware's most stylistically distinctive and atmospherically oppressive work — a Gothic horror action-RPG set in a city consumed by a plague that transforms its citizens into monstrous beasts. Yharnam is one of gaming's greatest environmental achievements: a Victorian city of cobblestone, gas lamps, and crumbling grandeur that conceals nightmares behind every door.\n\n  The combat represents a deliberate inversion of the Souls philosophy. Where Dark Souls rewards caution and deliberate defense, Bloodborne punishes hesitation — shields are largely useless, and the Rally system allows players to reclaim lost health by immediately attacking the enemy that dealt the damage. The result is a frenetic, aggressive combat system that feels utterly distinctive.\n\n  The narrative's Lovecraftian cosmic horror dimension — gradually revealed through item descriptions, environmental clues, and late-game reveals — ranks among gaming's most sophisticated examples of eldritch storytelling. The Old Hunters DLC, widely considered even stronger than the base game, adds essential areas and boss encounters that rank among FromSoftware's finest.`,features:[{icon:'🩸',title:'Rally System',desc:'Regain lost health by attacking immediately after being hit — rewarding aggression over defense.'},{icon:'🔫',title:'Trick Weapons',desc:'Transforming weapons shift between two combat forms with distinct move sets — guns support parrying.'},{icon:'🏛️',title:'Chalice Dungeons',desc:'Procedurally generated optional dungeons with unique loot and boss encounters.'},{icon:'🌙',title:'Insight System',desc:'Gathering Insight changes what you can perceive — affecting enemy appearances and revealing hidden truths.'},{icon:'😱',title:'Cosmic Horror',desc:'The true nature of Yharnam\'s affliction is revealed as something far beyond mere beast plague.'},{icon:'🎩',title:'Old Hunters DLC',desc:'An expansion widely considered exceptional even by Bloodborne\'s standards — essential content.'}],scores:[{label:'Metacritic',val:92,color:'#5b4fff'},{label:'OpenCritic',val:92,color:'#7c6bff'},{label:'IGN',val:97,color:'#ef4444'},{label:'GameSpot',val:100,color:'#f59e0b'},{label:'Eurogamer',val:100,color:'#10b981'},{label:'Game Informer',val:95,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.7/10',reviewer:'Marty Sliva',text:'Bloodborne is FromSoftware\'s masterpiece. Its atmosphere is oppressive and magnificent, its combat faster and more demanding than any of its predecessors, and Yharnam is one of gaming\'s great settings.'},{outlet:'GameSpot',score:'10/10',reviewer:'Scott Butterworth',text:'Extraordinary. Bloodborne is terrifying, exhilarating, and artistically extraordinary — FromSoftware operating at the absolute peak of their considerable powers.'},{outlet:'Eurogamer',score:'Essential',reviewer:'Edwin Evans-Thirlwell',text:'Bloodborne is an essential experience. Its world is like nothing in games — a Lovecraftian nightmare of beauty and dread that demands to be explored, suffered through, and ultimately understood.'}],awards:[{icon:'🏆',title:'Best PS4 Exclusive',org:'Multiple Publications 2015'},{icon:'🌟',title:'Best Action Game',org:'Multiple Awards 2015'},{icon:'🎮',title:'Best Art Direction',org:'Multiple Awards 2015'},{icon:'🏅',title:'GOTY Runner-Up',org:'Multiple Publications 2015'},{icon:'🌍',title:'Most Atmospheric Game',org:'Community Recognition'},{icon:'💡',title:'Old Hunters DLC GOTY',org:'Considered Standalone Quality'}],sysreq:{min:{OS:'PlayStation 4',CPU:'AMD Jaguar 8-core',RAM:'8 GB GDDR5',GPU:'AMD GCN 1.84 TFLOPS',Storage:'50 GB'},rec:{OS:'PlayStation 5 (via BC)',CPU:'AMD Zen 2 3.5GHz',RAM:'16 GB',GPU:'AMD RDNA 2 10.28 TFLOPS',Storage:'50 GB SSD'}},trivia:['Bloodborne was created as a collaboration between FromSoftware and Sony Japan Studio — giving Miyazaki freedom to pursue a non-fantasy setting with full platform exclusivity support.','There has been no PC port of Bloodborne despite years of fan petitions — it remains one of the most requested ports in the medium.','The Doll in the Hunter\'s Dream is the most beloved NPC in the Soulsborne series — her gentle, maternal presence contrasts devastatingly with Yharnam\'s horror.']},

'pubg':{rank:12,title:'PUBG: Battlegrounds',dev:'Krafton',publisher:'Krafton',year:2017,genre:'Battle Royale',subgenre:'Tactical Shooter',rating:8.2,score:82,platforms:['PS','Xbox','PC','Mobile'],img:'https://wstatic-prod.pubg.com/web/live/static/og/img-og-pubg.jpg',tags:['Battle Royale','Tactical','Survival','Competitive','Realistic','Ballistics','Erangel','Loot'],overview:`PUBG: Battlegrounds invented the modern battle royale genre as we know it — before Fortnite popularized it, before Apex refined it, Brendan "PlayerUnknown" Greene's vision of 100 players dropped onto an island to be the last one standing created the template that every subsequent battle royale followed.\n\n  Released in Steam Early Access in 2017, PUBG's commitment to realistic ballistics, authentic military equipment, and tactical gameplay on vast, detailed maps created a tense survival experience defined by every decision mattering. Bullet drop, weapon recoil patterns, and vehicle sound cues all required genuine knowledge to exploit — elevating skilled players in ways more arcade-oriented competitors could not.\n\n  PUBG Global Championship remains one of the most financially rewarding esports tournaments in the genre, with prize pools exceeding $3 million. The game's mobile version, PUBG Mobile, became one of the highest-grossing mobile games in history, demonstrating the breadth of the original's appeal.`,features:[{icon:'🗺️',title:'7 Maps',desc:'Erangel, Miramar, Sanhok, Vikendi, Karakin, Taego, and Deston — each with distinct tactical dynamics.'},{icon:'🔫',title:'Realistic Ballistics',desc:'True bullet drop, wind, and recoil patterns reward detailed weapon knowledge.'},{icon:'🚗',title:'Vehicle Strategy',desc:'Vehicles provide mobility but create noise and visibility — using them is a calculated tactical risk.'},{icon:'🎽',title:'Loot System',desc:'Randomized loot spawns ensure no two runs begin with the same equipment — adaptive strategy required.'},{icon:'⭕',title:'Blue Zone',desc:'The shrinking play area forces increasing confrontation — circle positioning is a crucial skill.'},{icon:'🏆',title:'PUBG Esports',desc:'PUBG Global Championship with $3M+ prize pools and massive regional circuit infrastructure.'}],scores:[{label:'Metacritic (PC)',val:86,color:'#5b4fff'},{label:'OpenCritic',val:82,color:'#7c6bff'},{label:'IGN',val:87,color:'#ef4444'},{label:'GameSpot',val:70,color:'#f59e0b'},{label:'PC Gamer',val:89,color:'#10b981'},{label:'User Score',val:66,color:'#3b82f6'}],reviews:[{outlet:'PC Gamer',score:'89/100',reviewer:'Samuel Roberts',text:'PUBG is the most tense, most rewarding, and most distinctively designed survival game I have played. Its commitment to tactical realism over arcade accessibility creates moments of genuine strategic satisfaction.'},{outlet:'IGN',score:'8.7/10',reviewer:'Ryan McCaffrey',text:'PUBG is a remarkable achievement in tension design. Every safe zone shift, every gunshot, every vehicle noise creates escalating paranoia that no other game in its genre quite replicates.'},{outlet:'Eurogamer',score:'Recommended',reviewer:'Oli Welsh',text:'Absolutely worth playing. PUBG\'s tactical depth and the genuine satisfaction of surviving against 99 other players is unmatched — even as competitors polish the formula it pioneered.'}],awards:[{icon:'🏆',title:'Invented the Genre',org:'Battle Royale Category'},{icon:'🌟',title:'Best PC Game',org:'Multiple Publications 2017'},{icon:'🎮',title:'Steam Record: 3.2M',org:'Peak Concurrent Players 2018'},{icon:'🏅',title:'Free-to-Play Transition',org:'2022 — New Player Record'},{icon:'🌍',title:'PUBG Mobile: #1',org:'Highest Grossing Mobile 2020'},{icon:'💡',title:'Genre Inventor',org:'All Battle Royales Indebted'}],sysreq:{min:{OS:'Windows 10 64-bit',CPU:'Intel Core i5-4430 / AMD FX-6300',RAM:'8 GB',GPU:'NVIDIA GTX 960 2GB / AMD R9 380 2GB',Storage:'40 GB SSD'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i7-4770K / AMD Ryzen 5 3600',RAM:'16 GB',GPU:'NVIDIA RTX 2060 / AMD RX 5700',Storage:'40 GB SSD'}},trivia:['At its peak in January 2018, PUBG had 3.24 million concurrent Steam players — a record that stood for years.','Brendan Greene previously developed battle royale mods for ARMA 2 and ARMA 3 before partnering with Bluehole (now Krafton) to develop PUBG.','PUBG Mobile has been downloaded over 1 billion times and remains one of the highest-grossing mobile games globally.']},

'ac-odyssey':{rank:28,title:"Assassin's Creed: Odyssey",dev:'Ubisoft Quebec',publisher:'Ubisoft',year:2018,genre:'Action-RPG',subgenre:'Ancient Greece',rating:8.5,score:85,platforms:['PS','Xbox','PC'],img:'https://wallpaperaccess.com/full/1110180.jpg',tags:['Open World','Greek Mythology','RPG','Naval Combat','Choice-Driven','Ancient Greece','Eagle Bearer','Mercenaries'],overview:`Assassin's Creed: Odyssey represents the franchise's most ambitious transformation — from stealth-action series to fully-fledged open-world RPG, set in a breathtakingly recreated ancient Greece of extraordinary scale and visual splendor.\n\n  Players choose between Alexios and Kassandra — a mercenary descended from the Spartan king Leonidas — navigating a world of city-states, mythological monsters, and political intrigue across the Peloponnesian War. The choice-driven dialogue system, branching quest lines, and multiple endings represented the most narrative flexibility the series had offered.\n\n  Greece itself is the game's greatest achievement — covering 130 square kilometers of mountain ranges, island archipelagos, city-states from Athens to Sparta, and a naval system of considerable depth. The mythology layer — confronting Cyclops, Medusa, and the Minotaur in optional questlines — added supernatural scope to an already enormous world. With 100+ hours of content, Odyssey remains Ubisoft's most expansive open-world achievement.`,features:[{icon:'⚡',title:'Kassandra/Alexios',desc:'Choose your Eagle Bearer — both fully voiced with complete story arcs and relationship paths.'},{icon:'🌊',title:'Naval Combat',desc:'Command a trireme across the Aegean, ramming enemy ships and launching crew in boarding actions.'},{icon:'🐍',title:'Mythological Quests',desc:'Encounter and defeat Medusa, the Minotaur, the Cyclops, and the Sphinx in dedicated questlines.'},{icon:'⚔️',title:'Mercenary System',desc:'A hierarchy of mercenaries pursue you based on your Bounty level — create rivalries and take contracts.'},{icon:'🗺️',title:'130 km² Map',desc:'The largest map in Assassin\'s Creed history — islands, mountains, cities, and underwater ruins.'},{icon:'🎭',title:'Dialogue Choices',desc:'Branching dialogue with relationship consequences affecting story outcomes and NPC reactions.'}],scores:[{label:'Metacritic (PC)',val:85,color:'#5b4fff'},{label:'OpenCritic',val:86,color:'#7c6bff'},{label:'IGN',val:95,color:'#ef4444'},{label:'GameSpot',val:80,color:'#f59e0b'},{label:'Eurogamer',val:80,color:'#10b981'},{label:'Game Informer',val:90,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.5/10',reviewer:'Dan Stapleton',text:'Assassin\'s Creed Odyssey is an extraordinary achievement in open-world RPG design. Ancient Greece is a stunning playground, Kassandra is one of gaming\'s most compelling protagonists, and the sheer volume of quality content is staggering.'},{outlet:'Game Informer',score:'9/10',reviewer:'Suriel Vazquez',text:'Odyssey is the most ambitious and content-rich Assassin\'s Creed game yet. Ancient Greece is brought to remarkable life, and the RPG systems are deep enough to sustain well over a hundred hours of play.'},{outlet:'GameSpot',score:'8/10',reviewer:'Kallie Plagge',text:'A spectacular setting and genuinely compelling protagonist make Odyssey one of the strongest entries in the series, despite some over-familiar structural bloat.'}],awards:[{icon:'🏆',title:'Best RPG',org:'The Game Awards 2018'},{icon:'🌟',title:'Best Open World',org:'Multiple Publications 2018'},{icon:'🎮',title:'Best Protagonist (Kassandra)',org:'Community Awards 2018'},{icon:'🏅',title:'Most Improved Franchise',org:'Multiple Publications'},{icon:'🌍',title:'130km² Greece Realized',org:'Largest AC Map'},{icon:'💡',title:'Setting of the Year',org:'Multiple Awards Bodies'}],sysreq:{min:{OS:'Windows 7 SP1/8.1/10 64-bit',CPU:'Intel Core i5-2400 / AMD FX-6350',RAM:'8 GB',GPU:'NVIDIA GTX 660 / AMD R9 285',Storage:'46 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i7-6700K / AMD Ryzen 5 1600',RAM:'16 GB',GPU:'NVIDIA GTX 1070 / AMD RX Vega 64',Storage:'46 GB SSD'}},trivia:['The map of Assassin\'s Creed Odyssey covers 130 square kilometers — Ubisoft\'s historical research team spent months ensuring geographical and architectural accuracy.','Kassandra was the canonical protagonist according to creative director Jonathan Dumont, though Alexios was marketed more prominently for commercial reasons.','The game\'s Discovery Tour mode allows players to explore ancient Greece without combat, used by educational institutions as a historical teaching tool.']},

'fifa23':{rank:30,title:'FIFA Series',dev:'EA Sports (now EA FC)',publisher:'Electronic Arts',year:2023,genre:'Sports',subgenre:'Football / Soccer',rating:7.8,score:78,platforms:['PS','Xbox','PC','Switch','Mobile'],img:'https://cdn1.epicgames.com/offer/f5deacee017b4b109476933f7dd2edbd/EGS_EASPORTSFIFA23StandardEdition_EACanada_S1_2560x1440-aaf9c5273c27a485f2cce8cb7e804f5c',tags:['Sports','Football','Ultimate Team','Competitive','Annual','Career Mode','Volta','World Cup'],overview:`The FIFA franchise — now rebranded EA Sports FC following the dissolution of the EA-FIFA partnership — is the world's most successful sports video game series with over 325 million copies sold across three decades. FIFA 23 was the final entry under the original license, featuring the first-ever simultaneous representation of both men's and women's World Cup tournaments in a FIFA game.\n\n  Ultimate Team — the card-collecting, squad-building mode introduced in FIFA 09 — became the franchise's primary revenue driver and cultural identity, generating billions annually through in-game purchases. Its combination of football management strategy and collectible card game mechanics created an addictive loop that dominates football gaming culture.\n\n  Career Mode received significant improvements in FIFA 23, including create-a-club functionality and more sophisticated player development systems. The gameplay itself, powered by HyperMotion2 technology capturing real match data from professional games, delivered the most physically authentic football simulation the series had achieved.`,features:[{icon:'⚽',title:'Ultimate Team',desc:'Build squads from player cards earned or purchased — the most-played mode and primary franchise identity.'},{icon:'🏆',title:'World Cup Modes',desc:'First FIFA to feature both men\'s and women\'s World Cups simultaneously as dedicated tournament modes.'},{icon:'🎮',title:'HyperMotion2',desc:'Motion capture technology using real match data to animate 6,000+ real football motion patterns.'},{icon:'👔',title:'Career Mode',desc:'Create-a-club functionality, improved player development, and more realistic manager simulation.'},{icon:'🏙️',title:'Volta Football',desc:'Street football mode set in global urban locations with skill tricks and 3v3 to 5v5 formats.'},{icon:'🌍',title:'30+ Leagues',desc:'700+ clubs and 30+ official leagues — the most comprehensive football license in gaming.'}],scores:[{label:'Metacritic (PS5)',val:78,color:'#5b4fff'},{label:'OpenCritic',val:77,color:'#7c6bff'},{label:'IGN',val:80,color:'#ef4444'},{label:'GameSpot',val:70,color:'#f59e0b'},{label:'Eurogamer',val:70,color:'#10b981'},{label:'User Score',val:53,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'8/10',reviewer:'Tristan Ogilvie',text:'FIFA 23 is the most feature-complete entry in the series\' history. HyperMotion2 produces genuinely more realistic football animation, Career Mode improvements are meaningful, and Ultimate Team remains compulsively engaging.'},{outlet:'GameSpot',score:'7/10',reviewer:'Phil Hornshaw',text:'FIFA 23 delivers on the pitch with its most authentic gameplay yet, even if it fails to address the structural concerns around Ultimate Team monetization that have dogged the series for years.'},{outlet:'Eurogamer',score:'3/5',reviewer:'Chris Tapsell',text:'An incremental step forward in an increasingly stagnant cycle. FIFA 23\'s football is good; its business model remains deeply problematic.'}],awards:[{icon:'🏆',title:'325M+ Copies Franchise',org:'Total Series Sales'},{icon:'🌟',title:'Final FIFA Branding',org:'Transitioned to EA FC 24'},{icon:'🎮',title:'Both World Cups',org:'Historic Dual License'},{icon:'🏅',title:'UT Revenue Record',org:'Highest Annual UT Revenue'},{icon:'🌍',title:'Most Licensed Sports Game',org:'700+ Clubs, 30+ Leagues'},{icon:'💡',title:'HyperMotion2',org:'Technical Innovation Award'}],sysreq:{min:{OS:'Windows 10/11 64-bit',CPU:'Intel Core i5-6600K / AMD Ryzen 5 1600',RAM:'8 GB',GPU:'NVIDIA GTX 970 / AMD RX 470',Storage:'100 GB'},rec:{OS:'Windows 10/11 64-bit',CPU:'Intel Core i7-6700 / AMD Ryzen 7 2700X',RAM:'12 GB',GPU:'NVIDIA RTX 2070 / AMD RX 5700 XT',Storage:'100 GB SSD'}},trivia:['The EA-FIFA licensing deal expired after FIFA 23 — EA rebranded to EA Sports FC, while FIFA sought other developers for future games under the FIFA name.','Ultimate Team generated approximately $1.62 billion in revenue for EA in fiscal year 2022 — representing nearly a third of the company\'s total digital revenue.','FIFA 23 was the first in the series to feature women\'s club football — with women\'s league teams from multiple countries including England\'s WSL and France\'s D1 Féminine.']}
};

/* ────────────────────────────────
   UTILITY FUNCTIONS
──────────────────────────────── */
const PM_LABELS={PS:'PlayStation',Xbox:'Xbox',PC:'PC',Switch:'Switch',Mobile:'Mobile'};
function rankClass(r){return r===1?'gold':r===2?'silver':r===3?'bronze':'';}
function rankEmoji(r){return r===1?'🥇 ':r===2?'🥈 ':r===3?'🥉 ':'#';}

function renderStars(rating){
  let html='';const full=Math.round(rating/2);
  for(let i=1;i<=5;i++) html+=`<span class="star ${i<=full?'filled':'empty'}">★</span>`;
  return html;
}
function getRatingLabel(r){
  if(r>=9.5)return'Masterpiece';if(r>=9.0)return'Outstanding';
  if(r>=8.5)return'Excellent';if(r>=8.0)return'Great';return'Good';
}

function pbStyle(p){
  const m={PS:'background:#e8f0fe;color:#1a56db;border:1px solid rgba(26,86,219,.2)',
    Xbox:'background:#e8fdf0;color:#057a55;border:1px solid rgba(5,122,85,.2)',
    PC:'background:#fff4e8;color:#c05621;border:1px solid rgba(192,86,33,.2)',
    Switch:'background:#fde8e8;color:#c81e1e;border:1px solid rgba(200,30,30,.2)',
    Mobile:'background:#e8f8fd;color:#0694a2;border:1px solid rgba(6,148,162,.2)'};
  return m[p]||'background:#edeaff;color:#5b4fff;border:1px solid rgba(91,79,255,.2)';
}

function getRelated(id,game){
  return Object.entries(GAMES)
    .filter(([k,g])=>k!==id&&(g.genre===game.genre||g.dev===game.dev||g.platforms.some(p=>game.platforms.includes(p))))
    .sort(()=>Math.random()-.5).slice(0,4);
}

/* ────────────────────────────────
   RENDER
──────────────────────────────── */
function render(id){
  const game=GAMES[id];
  if(!game){
    document.getElementById('mainContent').innerHTML=`<div class="not-found"><h2>Game not found</h2><p>We couldn't find that game in our archive.</p><a href="games.html" class="btn-primary" style="display:inline-flex">← Back to Games</a></div>`;
    return;
  }

  document.title=`GameVerse – ${game.title}`;
  document.getElementById('bc-title').textContent=game.title;

  const circ=2*Math.PI*34;
  const offset=circ*(1-game.score/100);
  const scoreCol=game.score>=90?'#5b4fff':game.score>=80?'#7c6bff':'#9d85ff';
  const rc=rankClass(game.rank);

  const platforms=game.platforms.map(p=>`<div class="plat-badge" style="${pbStyle(p)}"><span class="pb-dot" style="background:${p==='PS'?'#1a56db':p==='Xbox'?'#057a55':p==='PC'?'#c05621':p==='Switch'?'#c81e1e':'#0694a2'};"></span>${PM_LABELS[p]||p}</div>`).join('');
  const tags=game.tags.map(t=>`<span class="tag">${t}</span>`).join('');

  const featureCards=(game.features||[]).map(f=>`<div class="feature-card"><div class="fc-icon">${f.icon}</div><div class="fc-title">${f.title}</div><div class="fc-desc">${f.desc}</div></div>`).join('');

  const scoreItems=(game.scores||[]).map(s=>`<div class="score-item"><span class="si-label">${s.label}</span><div class="si-bar-wrap"><div class="si-bar" data-w="${s.val}" style="width:0%;background:${s.color}"></div></div><span class="si-num">${s.val}</span></div>`).join('');

  const reviewCards=(game.reviews||[]).map(r=>`<div class="review-card"><div class="rv-header"><span class="rv-outlet">${r.outlet}</span><span class="rv-score">${r.score}</span></div><div class="rv-reviewer">By ${r.reviewer}</div><div class="rv-text">"${r.text}"</div><div class="rv-stars">★★★★★</div></div>`).join('');

  const awardBadges=(game.awards||[]).map(a=>`<div class="award-badge"><div class="aw-icon">${a.icon}</div><div class="aw-title">${a.title}</div><div class="aw-org">${a.org}</div></div>`).join('');

  const sr=game.sysreq||{};
  const sysreqHTML=sr.min?`<div class="sysreq-grid">
    <div class="sysreq-col"><div class="sysreq-type"><span>Minimum</span><span class="badge badge-min">MIN</span></div>
      ${Object.entries(sr.min).map(([k,v])=>`<div class="sysreq-row"><span class="sr-key">${k}</span><span class="sr-val">${v}</span></div>`).join('')}
    </div>
    <div class="sysreq-col"><div class="sysreq-type"><span>Recommended</span><span class="badge badge-rec">REC</span></div>
      ${Object.entries(sr.rec).map(([k,v])=>`<div class="sysreq-row"><span class="sr-key">${k}</span><span class="sr-val">${v}</span></div>`).join('')}
    </div>
  </div>`:'<p style="color:var(--muted);font-size:.85rem">Available on console — see platform for requirements.</p>';

  const triviaItems=(game.trivia||[]).map((t,i)=>`<div class="trivia-item"><span class="ti-num">0${i+1}</span><p class="ti-text">${t}</p></div>`).join('');

  const related=getRelated(id,game);
  const relCards=related.map(([rid,rg],i)=>`<div class="rel-card" onclick="window.location='game-detail.html?id=${rid}'" style="animation-delay:${i*60}ms"><div class="rel-img"><img src="${rg.img}" alt="${rg.title}" onerror="this.style.opacity='.2'"/><div class="rel-img-overlay"></div></div><div class="rel-body"><div class="rel-rank">#${rg.rank} All Time</div><div class="rel-name">${rg.title}</div><div class="rel-meta"><span class="rel-genre">${rg.genre}</span><span class="rel-year">${rg.year}</span></div></div></div>`).join('');

  const overviewParagraphs=(game.overview||'').trim().split('\n\n').map(p=>`<p>${p.trim()}</p>`).join('');

  document.getElementById('mainContent').innerHTML=`
  <!-- HERO -->
  <section class="detail-hero">
    <div class="img-col">
      <div class="img-frame">
        <img src="${game.img}" alt="${game.title}" onerror="this.style.opacity='.2'"/>
        <div class="img-scan"></div>
        <div class="img-overlay"></div>
        <div class="img-rank-badge ${rc}">${rankEmoji(game.rank)} Rank #${game.rank} All Time</div>
        <div class="img-genre">${game.genre} · ${game.subgenre}</div>
      </div>
      <div class="stat-tiles">
        <div class="stat-tile" style="animation-delay:.06s"><div class="st-val">#${game.rank}</div><div class="st-lbl">All-Time Rank</div></div>
        <div class="stat-tile" style="animation-delay:.1s"><div class="st-val">${game.year}</div><div class="st-lbl">Released</div></div>
        <div class="stat-tile" style="animation-delay:.14s"><div class="st-val">${game.score}</div><div class="st-lbl">Metascore</div></div>
        <div class="stat-tile" style="animation-delay:.18s"><div class="st-val">${game.platforms.length}</div><div class="st-lbl">Platforms</div></div>
      </div>
      <div class="media-strip" id="mediaStrip"></div>
    </div>
    <div class="info-col">
      <div class="rank-chip"><span class="rc-dot"></span>🏆 Rank #${game.rank} All Time</div>
      <h1 class="game-title">${game.title}</h1>
      <div class="game-byline">
        by <span class="byline-dev">${game.dev}</span>
        <span class="byline-sep">·</span> ${game.publisher}
        <span class="byline-sep">·</span> ${game.genre} / ${game.subgenre}
        <span class="byline-sep">·</span> ${game.year}
      </div>
      <div class="star-row">
        <div class="stars">${renderStars(game.rating)}</div>
        <span class="rating-num">${game.rating}</span>
        <span class="rating-max">/ 10</span>
        <span class="rating-label">${getRatingLabel(game.rating)}</span>
      </div>
      <div class="info-divider"></div>
      <div class="sec-label">Platforms Available</div>
      <div class="platforms-row">${platforms}</div>
      <div class="sec-label">Genre Tags</div>
      <div class="tags-row">${tags}</div>
      <div class="info-divider"></div>
      <div class="sec-label">GameVerse Score</div>
      <div class="score-section">
        <div class="score-ring-wrap">
          <svg class="score-ring-svg" viewBox="0 0 78 78">
            <circle class="sr-track" cx="39" cy="39" r="34"/>
            <circle class="sr-fill" id="srFill" cx="39" cy="39" r="34"
              stroke="${scoreCol}" stroke-dashoffset="${circ}" data-target="${offset}"/>
            <text class="sr-text" x="39" y="36" text-anchor="middle" fill="${scoreCol}">${game.score}</text>
            <text class="sr-sub" x="39" y="48" text-anchor="middle" fill="#999">/100</text>
          </svg>
        </div>
        <div class="score-desc"><p>${(game.overview||'').split('\n\n')[0].trim().substring(0,220)}…</p></div>
      </div>
      <div class="cta-row">
        <a href="games.html" class="btn-secondary">← Back to Games</a>
        <button class="btn-primary" onclick="addWishlist('${id}',this)">+ Add to Wishlist</button>
      </div>
    </div>
  </section>

  <!-- DEEP INFO SECTIONS -->
  <div class="sections-wrap">
    <div class="info-section">
      <div class="is-header"><div class="is-icon">📖</div><div class="is-title">Story & Overview</div></div>
      <div class="story-text">${overviewParagraphs}</div>
    </div>

    ${featureCards?`<div class="info-section">
      <div class="is-header"><div class="is-icon">⚙️</div><div class="is-title">Key Features & Gameplay</div></div>
      <div class="features-grid">${featureCards}</div>
    </div>`:''}

    ${scoreItems?`<div class="info-section">
      <div class="is-header"><div class="is-icon">📊</div><div class="is-title">Critical Scores</div></div>
      <div class="scores-grid">${scoreItems}</div>
    </div>`:''}

    ${reviewCards?`<div class="info-section">
      <div class="is-header"><div class="is-icon">✍️</div><div class="is-title">Critic Reviews</div></div>
      <div class="reviews-list">${reviewCards}</div>
    </div>`:''}

    ${awardBadges?`<div class="info-section">
      <div class="is-header"><div class="is-icon">🏆</div><div class="is-title">Awards & Recognition</div></div>
      <div class="awards-grid">${awardBadges}</div>
    </div>`:''}

    <div class="info-section">
      <div class="is-header"><div class="is-icon">💻</div><div class="is-title">System Requirements</div></div>
      ${sysreqHTML}
    </div>

    ${triviaItems?`<div class="info-section">
      <div class="is-header"><div class="is-icon">💡</div><div class="is-title">Did You Know?</div></div>
      <div class="trivia-list">${triviaItems}</div>
    </div>`:''}
  </div>

  <!-- RELATED -->
  <section class="related-section">
    <div class="rel-header">
      <h2 class="rel-title">You Might Also Like</h2>
      <a href="games.html" class="rel-see-all">See All Games →</a>
    </div>
    <div class="related-grid">${relCards}</div>
  </section>`;

  // Animate score ring
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const el=document.getElementById('srFill');
    if(el) el.style.strokeDashoffset=el.dataset.target;
    // Animate score bars
    document.querySelectorAll('.si-bar').forEach(b=>{b.style.width=b.dataset.w+'%';});
  }));
}

function addWishlist(id,btn){
  const g=GAMES[id];
  const orig=btn.textContent;
  btn.textContent='✓ Added to Wishlist!';
  btn.style.background='#10b981';
  btn.style.boxShadow='0 10px 30px rgba(16,185,129,.35)';
  setTimeout(()=>{btn.textContent=orig;btn.style.background='';btn.style.boxShadow='';},2200);
}

// Init
const params=new URLSearchParams(window.location.search);
const gameId=params.get('id')||'gta5';
render(gameId);

// Particles
const pc=document.getElementById('particles');
['rgba(91,79,255,.13)','rgba(124,107,255,.1)','rgba(140,200,255,.09)','rgba(200,160,255,.08)'].forEach(c=>{
  for(let i=0;i<5;i++){
    const p=document.createElement('div');p.className='particle';
    const s=Math.random()*8+4;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${c};animation-duration:${5+Math.random()*8}s;animation-delay:-${Math.random()*7}s;`;
    pc.appendChild(p);
  }
});

// Scroll bar
window.addEventListener('scroll',()=>{
  const pct=window.scrollY/(document.body.scrollHeight-window.innerHeight)*100;
  document.getElementById('scrollBar').style.width=Math.min(pct,100)+'%';
},{passive:true});
</script>
</body>
