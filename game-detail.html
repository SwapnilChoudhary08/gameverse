<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GameVerse – Game Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f0f7;--white:#fff;
  --accent:#5b4fff;--accent2:#7c6bff;--accent-light:#edeaff;
  --dark:#0d0d14;--text:#111;--sub:#555;--muted:#999;
  --border:rgba(91,79,255,.12);--border2:rgba(91,79,255,.28);
  --shadow:0 4px 24px rgba(80,60,200,.08);
  --shadow-hover:0 20px 60px rgba(80,60,200,.16);
  --r:20px;
}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* ── AMBIENT BG ── */
.bg-blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(100px);}
.blob.a{width:750px;height:750px;top:-280px;left:-180px;background:radial-gradient(circle,rgba(180,160,255,.2),transparent 70%);animation:blobD 14s ease-in-out infinite alternate;}
.blob.b{width:500px;height:500px;bottom:-160px;right:-80px;background:radial-gradient(circle,rgba(140,200,255,.15),transparent 70%);animation:blobD 11s ease-in-out infinite alternate-reverse;}
.blob.c{width:380px;height:380px;top:55%;left:60%;background:radial-gradient(circle,rgba(200,160,255,.12),transparent 70%);animation:blobD 16s ease-in-out infinite alternate;animation-delay:-6s;}
@keyframes blobD{0%{transform:translate(0,0)scale(1);}100%{transform:translate(24px,-32px)scale(1.06);}}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(91,79,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(91,79,255,.04) 1px,transparent 1px);
  background-size:48px 48px;animation:gridMove 22s linear infinite;}
@keyframes gridMove{to{background-position:48px 48px;}}
.scanline{position:fixed;left:0;right:0;height:1.5px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(91,79,255,.28),rgba(124,107,255,.5),rgba(91,79,255,.28),transparent);
  animation:scanV 7s ease-in-out infinite;}
@keyframes scanV{0%{top:0%;opacity:0;}5%{opacity:1;}95%{opacity:1;}100%{top:100%;opacity:0;}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.particle{position:absolute;border-radius:50%;animation:pUp linear infinite;}
@keyframes pUp{0%{transform:translateY(0)scale(1);opacity:.7;}100%{transform:translateY(-100px)scale(.3);opacity:0;}}
.scroll-bar-wrap{position:fixed;top:72px;left:0;right:0;height:2px;z-index:300;}
.scroll-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .05s;}

/* ── NAV ── */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 60px;height:72px;
  background:rgba(240,240,247,.92);backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;
  box-shadow:0 2px 20px rgba(80,60,180,.06);}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:1.7rem;font-weight:900;text-decoration:none;color:var(--dark);}
.logo em{color:var(--accent2);font-style:normal;}
.nav-links{display:flex;gap:44px;list-style:none;}
.nav-links a{text-decoration:none;color:var(--sub);font-weight:500;font-size:1rem;transition:color .2s;position:relative;padding-bottom:4px;}
.nav-links a:hover{color:var(--accent);}
.nav-links li.active a{font-weight:700;color:var(--accent);}
.nav-links li.active a::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent);}
.btn-nav{background:var(--dark);color:#fff;border:none;border-radius:50px;padding:12px 26px;font-family:'Barlow',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:background .2s,transform .15s;}
.btn-nav:hover{background:var(--accent);transform:translateY(-1px);}

/* ── BREADCRUMB ── */
.breadcrumb{position:relative;z-index:2;padding:18px 60px 0;display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted);font-weight:500;animation:fadeUp .4s ease both;}
.breadcrumb a{color:var(--accent);text-decoration:none;font-weight:600;transition:opacity .2s;}
.breadcrumb a:hover{opacity:.7;}
.bc-sep{opacity:.35;}

/* ══════════════════════════
   HERO SPLIT LAYOUT
══════════════════════════ */
.detail-hero{
  position:relative;z-index:2;
  display:grid;grid-template-columns:520px 1fr;
  gap:56px;align-items:start;
  padding:36px 60px 50px;
}

/* LEFT column */
.img-col{animation:fadeUp .55s .05s ease both;}

.img-frame{
  position:relative;border-radius:22px;overflow:hidden;
  box-shadow:0 16px 60px rgba(91,79,255,.2),0 0 0 1.5px rgba(91,79,255,.18);
  background:linear-gradient(135deg,#e4e0f8,#ccc8ee);
  aspect-ratio:16/9;
}
.img-frame img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .5s ease;}
.img-frame:hover img{transform:scale(1.035);}
.img-frame::before,.img-frame::after{content:'';position:absolute;z-index:5;pointer-events:none;width:22px;height:22px;border-color:var(--accent);border-style:solid;}
.img-frame::before{top:10px;left:10px;border-width:2px 0 0 2px;border-radius:3px 0 0 0;}
.img-frame::after{bottom:10px;right:10px;border-width:0 2px 2px 0;border-radius:0 0 3px 0;}
.img-scan{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom,transparent 0%,rgba(91,79,255,.05) 50%,transparent 100%);
  animation:imgScan 3.5s ease-in-out infinite;}
@keyframes imgScan{0%,100%{transform:translateY(-100%);}50%{transform:translateY(100%);}}
.img-overlay{position:absolute;inset:0;z-index:2;background:linear-gradient(to top,rgba(255,255,255,.5) 0%,transparent 35%);}
.img-rank-badge{
  position:absolute;top:12px;left:12px;z-index:6;
  font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:900;letter-spacing:.05em;
  padding:5px 13px;border-radius:8px;backdrop-filter:blur(8px);
  background:rgba(255,255,255,.88);border:1.5px solid rgba(91,79,255,.22);color:var(--accent);
}
.img-rank-badge.gold{background:linear-gradient(135deg,#f5c842,#e0a800);color:#07070f;border:none;box-shadow:0 4px 16px rgba(245,200,66,.5);}
.img-rank-badge.silver{background:linear-gradient(135deg,#d4d4e8,#9ea0b8);color:#1a1a2e;border:none;}
.img-rank-badge.bronze{background:linear-gradient(135deg,#cd7f32,#a0521a);color:#fff;border:none;}
.img-genre{position:absolute;top:12px;right:12px;z-index:6;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid rgba(91,79,255,.2);color:var(--accent);font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:6px;}

/* 4 stat tiles */
.stat-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;}
.stat-tile{background:var(--white);border:1.5px solid rgba(91,79,255,.1);border-radius:14px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);transition:border-color .25s,transform .25s,box-shadow .25s;animation:fadeUp .5s ease both;cursor:default;}
.stat-tile:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:var(--shadow-hover);}
.st-val{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:900;color:var(--accent);line-height:1;}
.st-lbl{font-size:.58rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;}

/* media thumbs strip */
.media-strip{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;}
.media-strip::-webkit-scrollbar{height:3px;}
.media-strip::-webkit-scrollbar-thumb{background:rgba(91,79,255,.2);border-radius:4px;}
.media-thumb{flex-shrink:0;width:90px;height:54px;border-radius:8px;overflow:hidden;border:1.5px solid rgba(91,79,255,.12);cursor:pointer;transition:border-color .2s,transform .2s;}
.media-thumb:hover{border-color:var(--accent);transform:scale(1.04);}
.media-thumb img{width:100%;height:100%;object-fit:cover;object-position:center top;}

/* RIGHT column */
.info-col{animation:fadeUp .55s .12s ease both;}
.rank-chip{display:inline-flex;align-items:center;gap:8px;background:var(--accent-light);border:1.5px solid rgba(91,79,255,.28);border-radius:50px;padding:5px 16px;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:16px;}
.rc-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:rcPulse 1.8s infinite;}
@keyframes rcPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.5);}}
.game-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2.2rem,4vw,3.6rem);font-weight:900;line-height:.93;letter-spacing:-.02em;color:var(--dark);margin-bottom:10px;}
.game-byline{font-size:.88rem;color:var(--sub);margin-bottom:16px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
.byline-dev{color:var(--accent);font-weight:700;}
.byline-sep{opacity:.35;}

/* star rating */
.star-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.stars{display:flex;gap:1px;}
.star{font-size:1.05rem;}
.star.filled{color:#f59e0b;}
.star.empty{color:#ddd;}
.rating-num{font-family:'Barlow Condensed',sans-serif;font-size:1.35rem;font-weight:900;color:var(--dark);}
.rating-max{font-size:.78rem;color:var(--muted);font-weight:500;}
.rating-label{font-size:.7rem;font-weight:700;color:var(--accent);background:var(--accent-light);padding:3px 10px;border-radius:20px;border:1px solid rgba(91,79,255,.18);}

.info-divider{height:1px;background:linear-gradient(90deg,rgba(91,79,255,.18),transparent);margin:18px 0;}
.sec-label{font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.sec-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(91,79,255,.1),transparent);}

/* platforms */
.platforms-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.plat-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:50px;font-family:'DM Mono',monospace;font-size:.7rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;transition:transform .2s,box-shadow .2s;cursor:default;}
.plat-badge:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08);}
.pb-dot{width:6px;height:6px;border-radius:50%;}

/* tags */
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.tag{padding:5px 13px;border-radius:50px;font-size:.73rem;font-weight:600;color:var(--sub);background:var(--white);border:1.5px solid rgba(91,79,255,.13);transition:all .2s;cursor:default;}
.tag:hover{background:var(--accent-light);border-color:rgba(91,79,255,.3);color:var(--accent);}

/* score + overview */
.score-section{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;}
.score-ring-wrap{flex-shrink:0;}
.score-ring-svg{width:78px;height:78px;}
.sr-track{fill:none;stroke:rgba(91,79,255,.1);stroke-width:6;}
.sr-fill{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:213;transform:rotate(-90deg);transform-origin:39px 39px;transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1) .35s;}
.sr-text{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:900;}
.sr-sub{font-size:7.5px;font-weight:600;}
.score-desc p{font-size:.9rem;color:var(--sub);line-height:1.65;font-weight:400;}

/* CTA */
.cta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px;}
.btn-primary{display:flex;align-items:center;gap:8px;background:var(--dark);color:#fff;border:none;border-radius:50px;padding:13px 28px;font-family:'Barlow',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;text-decoration:none;transition:background .2s,transform .15s,box-shadow .2s;box-shadow:0 6px 24px rgba(13,13,20,.18);}
.btn-primary:hover{background:var(--accent);transform:translateY(-2px);box-shadow:0 10px 32px rgba(91,79,255,.4);}
.btn-secondary{display:flex;align-items:center;gap:8px;background:var(--white);color:var(--accent);border:2px solid rgba(91,79,255,.22);border-radius:50px;padding:11px 24px;font-family:'Barlow',sans-serif;font-size:.92rem;font-weight:700;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 4px 14px rgba(91,79,255,.07);}
.btn-secondary:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px);}

/* ══════════════════════════
   DEEP INFO SECTIONS
══════════════════════════ */
.sections-wrap{position:relative;z-index:2;padding:0 60px 20px;}

.info-section{background:var(--white);border:1.5px solid rgba(91,79,255,.1);border-radius:var(--r);padding:30px 32px;margin-bottom:16px;box-shadow:var(--shadow);animation:fadeUp .5s ease both;transition:border-color .3s,box-shadow .3s;}
.info-section:hover{border-color:rgba(91,79,255,.2);box-shadow:var(--shadow-hover);}
.is-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.is-icon{width:38px;height:38px;border-radius:10px;background:var(--accent-light);border:1.5px solid rgba(91,79,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.is-title{font-family:'Barlow Condensed',sans-serif;font-size:1.25rem;font-weight:900;color:var(--dark);letter-spacing:-.01em;}

/* ── STORY / OVERVIEW ── */
.story-text{font-size:.93rem;color:var(--sub);line-height:1.75;font-weight:400;}
.story-text p{margin-bottom:14px;}
.story-text p:last-child{margin-bottom:0;}

/* ── GAMEPLAY FEATURES ── */
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.feature-card{background:linear-gradient(135deg,rgba(91,79,255,.04),rgba(91,79,255,.01));border:1.5px solid rgba(91,79,255,.1);border-radius:14px;padding:16px;transition:all .2s;cursor:default;}
.feature-card:hover{border-color:rgba(91,79,255,.25);background:linear-gradient(135deg,rgba(91,79,255,.07),rgba(91,79,255,.02));transform:translateY(-2px);}
.fc-icon{font-size:1.4rem;margin-bottom:8px;}
.fc-title{font-family:'Barlow Condensed',sans-serif;font-size:.95rem;font-weight:800;color:var(--dark);margin-bottom:4px;letter-spacing:-.01em;}
.fc-desc{font-size:.76rem;color:var(--sub);line-height:1.5;}

/* ── SCORES TABLE ── */
.scores-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.score-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid rgba(91,79,255,.1);border-radius:12px;background:rgba(91,79,255,.02);transition:all .2s;}
.score-item:hover{border-color:rgba(91,79,255,.22);background:rgba(91,79,255,.04);}
.si-label{font-size:.78rem;font-weight:700;color:var(--sub);flex:1;}
.si-bar-wrap{flex:2;height:5px;background:rgba(91,79,255,.1);border-radius:10px;overflow:hidden;}
.si-bar{height:100%;border-radius:10px;transition:width 1s cubic-bezier(.4,0,.2,1) .4s;}
.si-num{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:900;color:var(--accent);min-width:36px;text-align:right;}

/* ── CRITIC REVIEWS ── */
.reviews-list{display:flex;flex-direction:column;gap:12px;}
.review-card{padding:18px 20px;border:1.5px solid rgba(91,79,255,.1);border-radius:14px;background:rgba(91,79,255,.02);transition:all .2s;}
.review-card:hover{border-color:rgba(91,79,255,.2);background:rgba(91,79,255,.04);}
.rv-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.rv-outlet{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:900;color:var(--dark);}
.rv-score{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:900;color:var(--accent);background:var(--accent-light);padding:3px 12px;border-radius:20px;border:1px solid rgba(91,79,255,.2);}
.rv-reviewer{font-size:.72rem;color:var(--muted);font-weight:500;margin-bottom:8px;}
.rv-text{font-size:.85rem;color:var(--sub);line-height:1.6;font-style:italic;}
.rv-stars{color:#f59e0b;font-size:.8rem;margin-top:8px;}

/* ── AWARDS ── */
.awards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.award-badge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 12px;border:1.5px solid rgba(91,79,255,.1);border-radius:14px;background:linear-gradient(135deg,rgba(91,79,255,.03),rgba(91,79,255,.01));transition:all .2s;cursor:default;}
.award-badge:hover{border-color:rgba(91,79,255,.25);transform:translateY(-3px);box-shadow:0 8px 24px rgba(91,79,255,.12);}
.aw-icon{font-size:1.8rem;margin-bottom:8px;}
.aw-title{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:900;color:var(--dark);line-height:1.2;margin-bottom:4px;}
.aw-org{font-size:.68rem;color:var(--muted);font-weight:600;letter-spacing:.05em;}

/* ── SYSTEM REQUIREMENTS ── */
.sysreq-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.sysreq-col{padding:18px 20px;border:1.5px solid rgba(91,79,255,.1);border-radius:14px;background:rgba(91,79,255,.02);}
.sysreq-type{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:900;color:var(--dark);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.sysreq-type .badge{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:.06em;}
.badge-min{background:#fde8e8;color:#c81e1e;}
.badge-rec{background:#e8fdf0;color:#057a55;}
.sysreq-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:.8rem;}
.sysreq-row:last-child{margin-bottom:0;}
.sr-key{font-weight:700;color:var(--sub);min-width:75px;flex-shrink:0;}
.sr-val{color:var(--text);font-weight:500;line-height:1.4;}

/* ── DID YOU KNOW ── */
.trivia-list{display:flex;flex-direction:column;gap:10px;}
.trivia-item{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1.5px solid rgba(91,79,255,.1);border-radius:12px;background:rgba(91,79,255,.02);transition:all .2s;}
.trivia-item:hover{border-color:rgba(91,79,255,.2);background:rgba(91,79,255,.04);}
.ti-num{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:900;color:var(--accent);opacity:.4;flex-shrink:0;min-width:24px;}
.ti-text{font-size:.85rem;color:var(--sub);line-height:1.6;}

/* ── SIMILAR GAMES ── */
.related-section{position:relative;z-index:2;padding:0 60px 80px;}
.rel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.rel-title{font-family:'Barlow Condensed',sans-serif;font-size:1.7rem;font-weight:900;color:var(--dark);letter-spacing:-.01em;}
.rel-see-all{font-size:.82rem;font-weight:700;color:var(--accent);text-decoration:none;transition:opacity .2s;}
.rel-see-all:hover{opacity:.7;}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.rel-card{background:var(--white);border-radius:16px;border:1.5px solid rgba(91,79,255,.1);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;animation:fadeUp .4s ease both;}
.rel-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-hover);border-color:rgba(91,79,255,.28);}
.rel-img{height:110px;overflow:hidden;background:linear-gradient(135deg,#e8e4f8,#d4d0f0);position:relative;}
.rel-img img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .4s ease;}
.rel-card:hover .rel-img img{transform:scale(1.08);}
.rel-img-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(255,255,255,.7) 0%,transparent 50%);}
.rel-body{padding:12px 14px 14px;}
.rel-rank{font-size:.62rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
.rel-name{font-family:'Barlow Condensed',sans-serif;font-size:.98rem;font-weight:900;color:var(--dark);line-height:1.2;margin-bottom:5px;}
.rel-meta{display:flex;align-items:center;gap:6px;}
.rel-genre{font-size:.63rem;font-weight:700;color:var(--accent);background:var(--accent-light);padding:2px 8px;border-radius:20px;}
.rel-year{font-size:.63rem;font-weight:600;color:var(--muted);}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

'tlou2':{rank:6,title:'The Last of Us Part II',dev:'Naughty Dog',publisher:'Sony Interactive Entertainment',year:2020,genre:'Action',subgenre:'Survival Horror',rating:9.3,score:93,platforms:['PS'],img:'https://image.api.playstation.com/vulcan/ap/rnd/202312/0117/da083fa5e19458dd750aa8a6ea30ba10bac6f87074693df5.jpg',tags:['Story Rich','Emotional','Survival','Post-Apocalyptic','Stealth','Dual Perspective','Brutal','Divisive'],overview:`The Last of Us Part II is one of gaming's most audacious and divisive narratives — a sequel that deliberately subverts player expectations about heroism, revenge, and moral clarity. Five years after the original, Ellie and Joel are living in Jackson, Wyoming, when a traumatic event sends Ellie on a cross-country path of vengeance.\n\n  What distinguishes TLOU2 is its insistence on inhabiting multiple perspectives — forcing players to experience the story through the eyes of characters they initially oppose. This structural choice generated significant controversy but also represents one of the most ambitious narrative experiments in mainstream game design.\n\n  Technically, the game is PlayStation 4's finest achievement — animation quality, environmental detail, and AI behavior all set new benchmarks. Combat is viscerally brutal by design, making violence feel costly and morally weighted rather than empowering. Naughty Dog's commitment to its own vision, regardless of audience expectation, marks TLOU2 as a genuinely important work.`,features:[{icon:'🎭',title:'Dual Perspective',desc:'Play as both Ellie and Abby across the same event — a structurally bold narrative experiment.'},{icon:'🌿',title:'Seattle Setting',desc:'An overgrown, gorgeously detailed Seattle provides the backdrop for the game\'s central conflict.'},{icon:'🐕',title:'Dog AI',desc:'Enemy dogs can track Ellie by scent — a tense, unprecedented stealth mechanic.'},{icon:'🔧',title:'Weapon Upgrades',desc:'Expanded crafting and upgrade trees across pistols, rifles, bows, and explosives.'},{icon:'🧗',title:'Traversal',desc:'Rope-swinging, crawling, and prone stealth add new dimensions to navigation and evasion.'},{icon:'🎵',title:'Gustavo Santaolalla',desc:'The returning composer delivers an equally haunting follow-up score.'}],scores:[{label:'Metacritic',val:93,color:'#5b4fff'},{label:'OpenCritic',val:93,color:'#7c6bff'},{label:'IGN',val:100,color:'#ef4444'},{label:'GameSpot',val:100,color:'#f59e0b'},{label:'The Guardian',val:100,color:'#10b981'},{label:'User Score',val:57,color:'#ef4444'}],reviews:[{outlet:'IGN',score:'10/10',reviewer:'Tom Marks',text:'The Last of Us Part II is a masterful, challenging, and unforgettable game that demands much of its players — emotionally and mechanically — and rewards them with one of the most impactful stories in the medium.'},{outlet:'GameSpot',score:'10/10',reviewer:'Kallie Plagge',text:'The Last of Us Part II succeeds because of its ambition, not despite it. It is a game that trusts its audience enough to challenge them at every level, and the result is something genuinely important.'},{outlet:'The Guardian',score:'5/5',reviewer:'Jordan Erica Webber',text:'Extraordinary. TLOU2 refuses to offer comfort or easy answers, demanding instead that players engage fully with its moral complexity. That difficulty is precisely what makes it essential.'}],awards:[{icon:'🏆',title:'Game of the Year',org:'The Game Awards 2020'},{icon:'🌟',title:'Best Narrative',org:'The Game Awards 2020'},{icon:'🎮',title:'Best Performance',org:'The Game Awards 2020'},{icon:'🏅',title:'Most Accessible Game',org:'BAFTA Games 2021'},{icon:'🌍',title:'GOTY – 300+ outlets',org:'Multiple Publications'},{icon:'💡',title:'Best Action Game',org:'The Game Awards 2020'}],sysreq:{min:{OS:'PS4 / PS5',CPU:'PS4: AMD Jaguar 8-core',RAM:'8 GB GDDR5',GPU:'PS4: AMD GCN 1.84 TFLOPS',Storage:'100 GB'},rec:{OS:'PlayStation 5',CPU:'PS5: AMD Zen 2 3.5GHz',RAM:'16 GB GDDR6',GPU:'PS5: AMD RDNA 2 10.28 TFLOPS',Storage:'100 GB SSD'}},trivia:['TLOU2 received a record 261 Game of the Year awards from media outlets — the most ever at the time.','The game took 7 years to develop following the original, with Naughty Dog\'s largest team yet.','The game\'s user score controversy sparked significant industry discussion about review bombing and critical consensus.','Every infected and human enemy has a unique name visible when you target them — reinforcing the weight of each death.']},

'fortnite':{rank:9,title:'Fortnite',dev:'Epic Games',publisher:'Epic Games',year:2017,genre:'Battle Royale',subgenre:'Construction Shooter',rating:8.5,score:85,platforms:['PS','Xbox','PC','Switch','Mobile'],img:'https://static0.gamerantimages.com/wordpress/wp-content/uploads/2023/06/fornite_splash_image.jpg',tags:['Battle Royale','Free-to-Play','Building','Pop Culture','Competitive','Live Events','Crossover','Cultural Icon'],overview:`Fortnite is a cultural phenomenon that transcends the boundaries of gaming. Launched as a co-op survival game in 2017, Epic Games pivoted to add a free-to-play Battle Royale mode that detonated across global culture with unprecedented speed.\n\n  What distinguished Fortnite from competitors was its building mechanic — players can harvest materials and construct walls, ramps, and structures mid-combat, adding a vertical, architectural dimension to gunplay that no other battle royale replicated convincingly. Combined with Epic's extraordinary live-event strategy — in-game concerts by Travis Scott and Ariana Grande, movie tie-in events, and ongoing seasonal map transformations — Fortnite became a living platform rather than a static game.\n\n  With over 350 million registered accounts and peak concurrent player counts exceeding 12 million, Fortnite's influence on the industry — from the battle pass monetization model to the concept of the game-as-platform — cannot be overstated.`,features:[{icon:'🏗️',title:'Building Combat',desc:'Harvest materials to build defensive structures, ramps, and towers mid-battle — unique to Fortnite.'},{icon:'🎪',title:'Live Events',desc:'Unprecedented in-game live events — concerts, story moments, and map transformations watched by millions.'},{icon:'🎭',title:'Crossover Content',desc:'Collaborations with Marvel, DC, Star Wars, NFL, musicians, and virtually every major IP.'},{icon:'🗺️',title:'Evolving Map',desc:'The island constantly transforms between seasons — entire biomes appear, disappear, and return evolved.'},{icon:'🎮',title:'Battle Pass',desc:'Popularized the season-based Battle Pass model now used across virtually the entire industry.'},{icon:'🆓',title:'Free-to-Play',desc:'Completely free to play with cosmetic-only monetization — no pay-to-win mechanics.'}],scores:[{label:'Metacritic (PC)',val:81,color:'#5b4fff'},{label:'OpenCritic',val:82,color:'#7c6bff'},{label:'IGN',val:82,color:'#ef4444'},{label:'GameSpot',val:80,color:'#f59e0b'},{label:'Eurogamer',val:85,color:'#10b981'},{label:'User Score',val:78,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'8.2/10',reviewer:'Ryan McCaffrey',text:'Fortnite\'s Battle Royale is compelling precisely because building introduces a skill ceiling unlike any other game in the genre. It\'s accessible, frantic, and endlessly replayable.'},{outlet:'Eurogamer',score:'Recommended',reviewer:'Christian Donlan',text:'There is nothing quite like Fortnite. Its blend of construction and battle royale combat creates moments of absurdity and brilliance that no other game in the genre can match.'},{outlet:'PC Gamer',score:'80/100',reviewer:'James Davenport',text:'Fortnite is a legitimately excellent battle royale whose building mechanics give it a ceiling of skill and creativity that PUBG and its ilk simply cannot match.'}],awards:[{icon:'🏆',title:'Best Free-to-Play Game',org:'The Game Awards 2018'},{icon:'🌟',title:'Cultural Phenomenon',org:'TIME Magazine Coverage'},{icon:'🎮',title:'Most Registered Accounts',org:'350M+ Epic Games 2023'},{icon:'🏅',title:'Best Mobile Game',org:'Multiple Awards 2018'},{icon:'🌍',title:'Travis Scott Concert: 12M',org:'Peak Concurrent Players'},{icon:'💡',title:'Industry Model Change',org:'Battle Pass Popularized'}],sysreq:{min:{OS:'Windows 10 64-bit',CPU:'Core i3-3225 3.3GHz',RAM:'8 GB',GPU:'Intel HD 4000',Storage:'15 GB'},rec:{OS:'Windows 11 64-bit',CPU:'Core i7-8700 / AMD Ryzen 7 3700X',RAM:'16 GB',GPU:'NVIDIA RTX 3070 / AMD RX 6700 XT',Storage:'15 GB SSD'}},trivia:['The Travis Scott Astronomical concert event in April 2020 was attended by 12.3 million concurrent players — a record for any in-game event.','Fortnite Chapter 1\'s black hole event in October 2019 took the entire game offline for 36 hours, generating 1.5 billion social media impressions.','Epic Games\' legal battle with Apple over App Store policies began after Fortnite was removed from iOS in 2020 for violating payment rules.','The game\'s "emote" system — particularly the Floss dance — generated significant legal debate about choreography copyright.']},

'halo-ce':{rank:10,title:'Halo: Combat Evolved',dev:'Bungie',publisher:'Microsoft Game Studios',year:2001,genre:'FPS',subgenre:'Sci-Fi Shooter',rating:9.4,score:94,platforms:['Xbox','PC'],img:'https://static1.srcdn.com/wordpress/wp-content/uploads/2020/03/Halo-Combat-Evolved-.jpg',tags:['FPS','Sci-Fi','Console Shooter','Co-op','Classic','Flood','Covenant','Master Chief'],overview:`Halo: Combat Evolved is the game that proved console first-person shooters were not just viable but could define the genre. Launched alongside the original Xbox in November 2001, it was a system seller of the highest order and the beginning of one of gaming's most beloved franchises.\n\n  Set on a mysterious ring-world called Halo, the game placed players in the armor of Master Chief — a super-soldier of enigmatic humanity — against two alien threats: the Covenant, a religious empire, and the Flood, a parasitic organism of cosmic horror. The narrative, unfolding across the alien installation's varied biomes, delivered genuine science-fiction storytelling of a caliber the FPS genre had rarely achieved.\n\n  Bungie's design innovations were numerous: recharging shields eliminated the frustration of health management; a two-weapon limit created tactical decision-making; vehicle sections introduced scale; and the Warthog jeep allowed genuine vehicular combat. Split-screen co-op at launch made it a social phenomenon in living rooms worldwide.`,features:[{icon:'🛡️',title:'Recharging Shields',desc:'Pioneered the now-universal shield recharge system that eliminated health pack management.'},{icon:'🔫',title:'Two-Weapon Limit',desc:'Carrying only two weapons at a time forced constant tactical decision-making.'},{icon:'🚗',title:'Vehicle Combat',desc:'Warthog jeep and Ghost sections introduced large-scale vehicular combat to console shooters.'},{icon:'👾',title:'The Flood',desc:'A mid-game enemy type reveal that dramatically shifted the game\'s tone toward survival horror.'},{icon:'👥',title:'Split-Screen Co-op',desc:'Full campaign playable in two-player split-screen — a defining social experience of the era.'},{icon:'🎵',title:'Marty O\'Donnell Score',desc:'The iconic Halo Theme — performed by a Gregorian choir — is one of gaming\'s most recognizable compositions.'}],scores:[{label:'Metacritic (Xbox)',val:97,color:'#5b4fff'},{label:'OpenCritic',val:95,color:'#7c6bff'},{label:'IGN',val:97,color:'#ef4444'},{label:'GameSpot',val:97,color:'#f59e0b'},{label:'Edge Magazine',val:100,color:'#10b981'},{label:'PC Gamer',val:90,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'9.7/10',reviewer:'Fran Mirabella III',text:'Halo: Combat Evolved is simply the finest first-person shooter to grace a console. Its scale, its story, its control, and its multiplayer combine into an experience that redefines what the genre is capable of.'},{outlet:'GameSpot',score:'9.7/10',reviewer:'Jeff Gerstmann',text:'Halo is a remarkable achievement. It proves definitively that console shooters can be compelling, deep, and varied — and that the Xbox has at least one killer app worthy of the platform.'},{outlet:'Edge',score:'10/10',reviewer:'Edge Staff',text:'Extraordinary. Halo: Combat Evolved does not merely deliver an excellent shooter — it expands what the FPS genre is and establishes a template that will be studied for decades.'}],awards:[{icon:'🏆',title:'System Seller of the Year',org:'Xbox Launch 2001'},{icon:'🌟',title:'Best Console Shooter',org:'Multiple Publications 2001'},{icon:'🎮',title:'Game of the Year',org:'Multiple Awards 2001'},{icon:'🏅',title:'Xbox\'s Defining Title',org:'Historical Recognition'},{icon:'🌍',title:'Franchise Launched',org:'Multiple Sequels & Media'},{icon:'💡',title:'Co-op Design Award',org:'Gaming Legacy Recognition'}],sysreq:{min:{OS:'Windows XP/Vista/7',CPU:'1GHz or faster processor',RAM:'256 MB',GPU:'32MB DirectX 8.1 compatible GPU',Storage:'1.2 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i5 / AMD Ryzen 5 (via MCC)',RAM:'8 GB',GPU:'NVIDIA GTX 1060 / AMD RX 480',Storage:'55 GB (MCC Complete)'}},trivia:['Halo CE was originally planned as a Mac/PC real-time strategy game before Bungie was acquired by Microsoft and it was reimagined as an Xbox FPS.','The "Silent Cartographer" level — a beach assault followed by a vast interior — is cited by design experts as one of the greatest individual game levels ever created.','Master Chief\'s face is never revealed in any mainline Halo game — a deliberate design choice to allow player projection.',"Martin O'Donnell composed the iconic Halo Theme in under a day, inspired by Bungie's visual style and Greek choir music."]},

'mario-odyssey':{rank:11,title:'Super Mario Odyssey',dev:'Nintendo EPD',publisher:'Nintendo',year:2017,genre:'Platformer',subgenre:'3D Collectathon',rating:9.4,score:94,platforms:['Switch'],img:'https://samurai-gamers.com/wp-content/uploads/2017/10/sg-super-mario-odyssey-walkthrough-and-guide.jpg',tags:['Platformer','Colorful','Family','Collectathon','Cappy','Kingdoms','Nintendo','Joyful'],overview:`Super Mario Odyssey is Nintendo's masterclass in platformer design — a joyful, technically dazzling open-world 3D platformer that introduced Cappy, a hat companion that grants Mario the ability to capture and inhabit enemies, objects, and creatures.\n\n  The capture mechanic opened a design space of extraordinary breadth. Playing as a T-Rex, a Bullet Bill, an electrical tower, or a lake monster — each control differently, each enables different puzzle solutions. The game's 17 kingdoms span wildly diverse themes, from a sun-baked Mexican-inspired desert to a photorealistic human city that contrasts beautifully with Mario's cartoon proportions.\n\n  Super Mario Odyssey is one of the purest expressions of Nintendo's design philosophy: every mechanic serves joy, every corner hides a surprise, and every kingdom is crafted with love for the player's sense of discovery. Its ending alone — a joyful, extended victory lap — is among gaming's most delightful final acts.`,features:[{icon:'🎩',title:'Cappy System',desc:'Throw Cappy to capture enemies and objects, each with unique movement and abilities.'},{icon:'🌍',title:'17 Kingdoms',desc:'Each kingdom has a unique theme, visual style, and set of mechanical puzzles to solve.'},{icon:'🌕',title:'880 Power Moons',desc:'Hundreds of Power Moons hidden in every corner — far more than required, enabling exploration at your pace.'},{icon:'🎵',title:'Jump Up, Super Star!',desc:'Musical sequences within levels where Mario dances to original songs — a Nintendo first.'},{icon:'2D',title:'Retro Sections',desc:'Hidden pipes transport Mario into flat 2D sections styled after the original NES games.'},{icon:'👑',title:'Post-Game',desc:'A massive additional challenge unlocked after completion — the Mushroom Kingdom returns.'}],scores:[{label:'Metacritic',val:97,color:'#5b4fff'},{label:'OpenCritic',val:97,color:'#7c6bff'},{label:'IGN',val:100,color:'#ef4444'},{label:'GameSpot',val:100,color:'#f59e0b'},{label:'Eurogamer',val:100,color:'#10b981'},{label:'Game Informer',val:98,color:'#3b82f6'}],reviews:[{outlet:'IGN',score:'10/10',reviewer:'Jose Otero',text:'Super Mario Odyssey is a genre-defining achievement. The Cappy mechanic alone is worth the price of admission, and Nintendo uses it with a creative generosity that makes every kingdom feel like a new game.'},{outlet:'GameSpot',score:'10/10',reviewer:'Peter Brown',text:'One of the finest platformers ever made. Mario Odyssey is packed to the brim with ideas, executed with Nintendo\'s characteristic precision, and wrapped in an aesthetic of pure, irresistible joy.'},{outlet:'Eurogamer',score:'Essential',reviewer:'Oli Welsh',text:'Extraordinary. Super Mario Odyssey is Nintendo at its most uninhibited — a celebration of everything the platformer genre can be, and a new benchmark for the form.'}],awards:[{icon:'🏆',title:'Best Platformer',org:'The Game Awards 2017'},{icon:'🌟',title:'Best Family Game',org:'The Game Awards 2017'},{icon:'🎮',title:'GOTY Runner-Up',org:'Multiple Publications 2017'},{icon:'🏅',title:'Best Nintendo Game',org:'Multiple Awards 2017'},{icon:'🌍',title:'Best New Mechanic',org:'Industry Recognition'},{icon:'💡',title:'Most Joyful Game',org:'Countless Publications'}],sysreq:{min:{OS:'Nintendo Switch System Software',CPU:'Nintendo Switch SoC',RAM:'4 GB',GPU:'Nvidia Tegra X1',Storage:'5.7 GB'},rec:{OS:'Nintendo Switch (OLED Model)',CPU:'Nintendo Switch SoC',RAM:'4 GB',GPU:'Nvidia Tegra X1 (docked 1080p)',Storage:'5.7 GB + microSD'}},trivia:['Cappy was designed first — Nintendo built entire kingdoms around the mechanic after realizing its potential.','There are 880 Power Moons in the game — far more than the ~120 required to complete it, enabling completionists dozens of additional hours.','The New Donk City festival sequence — with Mayor Pauline singing "Jump Up, Super Star!" — features every major 2D Mario game as a musical callback.']},

'dark-souls':{rank:13,title:'Dark Souls',dev:'FromSoftware',publisher:'Bandai Namco',year:2011,genre:'Action-RPG',subgenre:'Soulslike',rating:9.3,score:93,platforms:['PS','Xbox','PC'],img:'https://upload.wikimedia.org/wikipedia/en/8/8d/Dark_Souls_Cover_Art.jpg',tags:['Soulslike','Challenging','Dark Fantasy','Interconnected World','Cryptic Lore','Boss Fights','Covenant','Fire'],overview:`Dark Souls spawned a genre. Hidetaka Miyazaki's follow-up to Demon's Souls refined and expanded the demanding, deliberate action-RPG formula into a game of extraordinary structural brilliance — Lordran, its interconnected world, remains one of gaming's greatest achievements in three-dimensional level design.\n\n  Every area in Lordran connects to every other without a loading screen, flowing organically from the undead asylum to Firelink Shrine, through the Undead Burg, down into Blighttown, up to Anor Londo, and out into the Duke's Archives. Discovering a new shortcut that loops back to a previously visited bonfire is among gaming's most satisfying feelings.\n\n  The game's combat — measured, deliberate, unforgiving — demanded a new contract with the player: attention, patience, and learning from death. Its cryptic lore, communicated through item descriptions and environmental detail rather than explicit narrative, created a community of dedicated researchers whose collective decoding of Lordran's history continues to this day.`,features:[{icon:'🌍',title:'Interconnected World',desc:'Lordran\'s seamlessly connected world — no loading screens between areas — is a marvel of 3D design.'},{icon:'⚔️',title:'Deliberate Combat',desc:'Every swing, block, and roll is weighted and measured — combat rewards patience and positional awareness.'},{icon:'🔥',title:'Bonfire System',desc:'Bonfires serve as checkpoints, respawn points, and fast travel hubs — the game\'s central mechanical metaphor.'},{icon:'📖',title:'Cryptic Lore',desc:'Story delivered through item descriptions and environment — pieced together by a passionate community.'},{icon:'🏰',title:'45+ Bosses',desc:'Each boss demands specific strategies, punishing aggression and rewarding careful study.'},{icon:'👥',title:'Co-op & Invasion',desc:'Summon allies or invade other players\' worlds for asymmetric multiplayer of elegant design.'}],scores:[{label:'Metacritic (PS3)',val:89,color:'#5b4fff'},{label:'OpenCritic',val:91,color:'#7c6bff'},{label:'IGN',val:90,color:'#ef4444'},{label:'GameSpot',val:90,color:'#f59e0b'},{label:'Eurogamer',val:100,color:'#10b981'},{label:'Edge Magazine',val:100,color:'#3b82f6'}],reviews:[{outlet:'Eurogamer',score:'10/10',reviewer:'Tom Bramwell',text:'Dark Souls is one of the most important games ever made. It redefines what difficulty means in games, proving that challenge and accessibility are not opposites, and creating a world of extraordinary coherence and depth.'},{outlet:'Edge',score:'10/10',reviewer:'Edge Staff',text:'A masterpiece. Dark Souls demands more of its players than almost any game in recent memory, and repays that investment with an experience of rare depth, atmosphere, and satisfaction.'},{outlet:'IGN',score:'9/10',reviewer:'Anthony Gallegos',text:'Dark Souls is exceptional. Its world design is the finest in the genre, its combat is deeply satisfying once mastered, and its atmosphere is unlike anything else in gaming.'}],awards:[{icon:'🏆',title:'Genre-Defining Title',org:'Industry Historical Recognition'},{icon:'🌟',title:'Best Design',org:'Multiple Publications 2011'},{icon:'🎮',title:'Innovation Award',org:'GDC Awards 2012'},{icon:'🏅',title:'Spawned a Genre',org:'The Soulslike Category'},{icon:'🌍',title:'Community Achievement',org:'Ongoing Lore Research'},{icon:'💡',title:'Excellence in Design',org:'Academic Study Subject'}],sysreq:{min:{OS:'Windows 7 SP1 64-bit',CPU:'Intel Core i5-2300 / AMD A8-3870',RAM:'4 GB',GPU:'NVIDIA GTX 465 / AMD HD 6870',Storage:'4 GB'},rec:{OS:'Windows 10 64-bit',CPU:'Intel Core i7 / AMD Ryzen 5',RAM:'8 GB',GPU:'NVIDIA GTX 1060 / AMD RX 580',Storage:'4 GB SSD'}},trivia:['Dark Souls was a spiritual successor to Demon\'s Souls — Miyazaki directed it with new publisher Bandai Namco after From\'s internal reshuffling.','The game\'s iconic "YOU DIED" screen has become a meme representing any difficult challenge in popular culture.','Lordran\'s map was designed with a physical 3D model before any digital work began — ensuring all connections made logical spatial sense.']},
